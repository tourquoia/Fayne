<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fayne’s Mini Language Course</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#050607}
  body{min-height:100vh;font-family:Arial,Helvetica,sans-serif}
  .screen{position:relative;width:100%;max-width:1022px;margin:0 auto;aspect-ratio:1022 / 1536;overflow:hidden;background:#050607}
  .screen-image{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hotspot{position:absolute;display:block;text-decoration:none;background:transparent;cursor:pointer;border-radius:inherit}
  .hotspot:focus-visible{outline:3px solid #ffab28;outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* Hotspots scale with the 1022×1536 artwork. */
  .moon{left:3.816%;top:2.214%;width:14.188%;height:10.026%;border-radius:50%}
  .heart{left:84.735%;top:3.971%;width:10.568%;height:6.771%}
  .main-course{left:4.990%;top:15.100%;width:89.922%;height:47.000%;border-radius:29px}
  .brennan{left:4.403%;top:62.450%;width:91.000%;height:6.250%;border-radius:15px}
  .errores{left:4.403%;top:69.950%;width:91.000%;height:12.500%;border-radius:15px}

  /* Stronger click affordances: white button rings + white labels. */
  .main-course{
    position:absolute;
  }
  .main-course::before{
    content:"";
    position:absolute;
    left:50%;
    top:28%;
    width:40%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#050607;
    border:5px solid #fff;
    box-shadow:0 0 10px rgba(255,255,255,.85),0 0 28px rgba(255,166,36,.72),0 0 55px rgba(255,166,36,.38);
    z-index:2;
  }
  .main-course::after{
    content:"";
    position:absolute;
    left:50%;
    top:28%;
    width:0;
    height:0;
    transform:translate(-35%,-50%);
    border-top:53px solid transparent;
    border-bottom:53px solid transparent;
    border-left:84px solid #ff9f1c;
    filter:drop-shadow(0 0 8px rgba(255,159,28,.95)) drop-shadow(0 0 18px rgba(255,159,28,.6));
    z-index:3;
  }

  .brennan,.errores{
    position:absolute;
    z-index:5;
    background:rgba(5,6,7,.92);
    border:3px solid #fff;
    box-shadow:0 0 12px rgba(255,255,255,.34),0 0 22px rgba(255,166,36,.24), inset 0 0 16px rgba(255,166,36,.05);
    display:flex;
    align-items:center;
    padding:0 8.5%;
  }
  .brennan::after{
    content:"BRENNAN VACATION";
    white-space:nowrap;
  }
  .errores::after{
    content:"ERRORES COMUNES (EN ESPAÑOL)";
  }
  .brennan::after,.errores::after{
    color:#fff;
    display:block;
    max-width:88%;
    font-size:clamp(22px,3.6vw,40px);
    font-weight:700;
    letter-spacing:.01em;
    white-space:normal;
    line-height:1.15;
    text-shadow:0 0 7px rgba(255,255,255,.45);
  }
  .brennan:hover,.errores:hover{
    box-shadow:0 0 12px rgba(255,255,255,.5),0 0 24px rgba(255,166,36,.34);
    background:#0a0c0e;
  }
  .brennan::before,.errores::before{
    content:"›";
    position:absolute;
    right:2.6%;
    top:50%;
    transform:translateY(-53%);
    color:#fff;
    font-size:clamp(34px,4.5vw,50px);
    line-height:1;
    text-shadow:0 0 8px rgba(255,255,255,.5);
  }
</style>
</head>
