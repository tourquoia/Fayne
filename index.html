<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fayne’s Mini Language Course</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #f8f9fa; }
  body { min-height: 100vh; font-family: system-ui, -apple-system, sans-serif; }
  
  .screen {
    position: relative;
    width: 100%;
    max-width: 1022px;
    margin: 0 auto;
    aspect-ratio: 1022 / 1536;
    overflow: hidden;
    background: #f8f9fa;
    padding-top: 2.5%;
  }
  
  /* Top Header Navigation Bar */
  .header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    margin-bottom: 4%;
  }
  
  .header-title {
    color: #0f172a;
    font-size: clamp(18px, 2.6vw, 28px);
    font-weight: 800;
    letter-spacing: 0.04em;
    text-align: center;
    margin: 0;
  }

  .icon-btn {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    cursor: pointer;
    flex-shrink: 0;
  }

  .moon { border: 2px solid #cbd5e1; }
  .moon svg { width: 22px; height: 22px; fill: #64748b; }

  .heart { border: 2px solid #ef4444; }
  .heart svg { width: 22px; height: 22px; fill: #ef4444; }

  .hotspot:focus-visible { outline: 3px solid #ff8c00; outline-offset: 4px; }

  /* Compact Main Player Card */
  .main-course {
    width: 90%;
    margin: 0 auto 3% auto;
    padding: 8% 4%;
    border-radius: 24px;
    background: #ffffff;
    border: 2.5px solid #ff8c00;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  
  /* Flat Orange Play Button (No Shadows) */
  .play-button-container {
    width: 130px; height: 130px;
    border-radius: 50%;
    background: #ff8c00;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  
  .play-icon {
    width: 0; height: 0;
    margin-left: 8px;
    border-top: 22px solid transparent;
    border-bottom: 22px solid transparent;
    border-left: 36px solid #ffffff;
  }

  .player-label {
    color: #0f172a;
    font-size: clamp(16px, 2.2vw, 22px);
    font-weight: 700;
    letter-spacing: 0.03em;
    text-align: center;
  }

  /* Secondary Track Buttons */
  .track-list {
    width: 90%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .track-btn {
    width: 100%;
    height: 72px;
    background: #ffffff;
    border: 2px solid #e2e8f0;
    border-left: 10px solid #ff8c00;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    text-decoration: none;
    cursor: pointer;
  }

  .track-title {
    color: #0f172a;
    font-size: clamp(15px, 2vw, 22px);
    font-weight: 700;
  }
  
  .chevron {
    color: #ff8c00;
    font-size: clamp(24px, 3.5vw, 36px);
    font-weight: 700;
  }
</style>
</head>
<body>
  <main class="screen" aria-label="Fayne’s Mini Language Course">
    <header class="header-bar">
      <a href="#theme" class="icon-btn moon" aria-label="Toggle Theme">
        <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </a>
      <h1 class="header-title">FAYNE'S MINI LANGUAGE COURSE</h1>
      <a href="#favorites" class="icon-btn heart" aria-label="Favorites">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </a>
    </header>
    
    <a href="#main" class="hotspot main-course">
      <div class="play-button-container">
        <div class="play-icon"></div>
      </div>
      <div class="player-label">MAIN PLAYER / REPRODUCTOR PRINCIPAL</div>
    </a>
    
    <div class="track-list">
      <a href="#brennan" class="track-btn">
        <span class="track-title">BRENNAN VACATION</span>
        <span class="chevron">›</span>
      </a>
      <a href="#errores" class="track-btn">
        <span class="track-title">ERRORES COMUNES (EN ESPAÑOL)</span>
        <span class="chevron">›</span>
      </a>
    </div>
  </main>
</body>
</html>
