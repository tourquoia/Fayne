  'to-en-nz': {
    matchPrefixes:['to','en'], alwaysApproximate:true, boost:['NZ'], primary:'NZ',
    label:{ en:'New Zealand English (standing in for Tongan, which has no dedicated voice)', es:'ingl\u00e9s neozeland\u00e9s (para el tongano)' },
  },
  // Klingon is constructed and has no real-world region to anchor a
  // fallback to, so it defaults to plain US English like Navajo does.
  // Tries an actual "tlh" voice first.
  'tlh-en': {
    matchPrefixes:['tlh','en'], alwaysApproximate:true, boost:['US'], primary:'US',
    label:{ en:'English (standing in for Klingon, which has no dedicated voice)', es:'ingl\u00e9s (para el klingon)' },
  },
};

// Maps a selectable language `code` (as used in a course's langs array) to
// the region-profile key that governs its voice defaults. Unlisted codes
// fall back to their own 2-letter prefix as the profile key (and, failing
// that, to no profile at all — meaning no region preference is applied).
// When adding a new language/register to a course, add its `code` here if
// it needs a specific default region, shares a prefix with another
// register, or has no dedicated voice.
const CODE_TO_REGION_KEY = {
  'pt-BR':'pt-BR', 'pt-PT':'pt-PT', 'pt-AFR':'pt-AFR', 'pt':'pt-BR',
  'fr-FR':'fr-FR', 'fr-AFR':'fr-AFR', 'fr':'fr-FR',
  'la-CI':'la-hisp', 'la-HV':'la-hisp', 'la-VA':'la-ecc', 'la':'la-ecc',
  'lo':'lo-th',
  // Every African language below has no dedicated browser/OS voice and no
  // better regional match, so all of them share the same Nigerian-English
  // catch-all fallback (see the 'afr-en-ng' profile above).
  'ln':'afr-en-ng', 'sw':'afr-en-ng', 'ha':'afr-en-ng', 'yo':'afr-en-ng',
  'zu':'afr-en-ng', 'xh':'afr-en-ng', 'ig':'afr-en-ng', 'am':'afr-en-ng',
  'nv':'nv-en', 'nah-hua':'nah-es', 'quz':'quz-es',
  'sm':'sm-en-nz', 'haw':'haw-en-us', 'mi':'mi-en-nz', 'to':'to-en-nz',
  // Susu has no dedicated voice either; routed to the same Nigerian-English
  // catch-all as the other no-better-option African languages above
  // (previously stood in with Guinean French, but that never resolves to
  // an actually-installed voice on real devices any better than this does).
  'sus':'afr-en-ng', 'tlh':'tlh-en',
};
// Normalizes a language code's casing to match this file's own convention
// (and the literal keys used in CODE_TO_REGION_KEY / REGION_PROFILES above):
// the primary subtag lowercase (e.g. 'es', 'en'), and any subtag after a
// '-' UPPERCASE (e.g. 'pt-BR', 'fr-AFR', 'la-VA') — a blanket .toLowerCase()
// would silently break those intentionally-uppercase region suffixes.
// Spreadsheet authors are inconsistent about casing inside the header
// parentheses ("Spanish (ES)" vs "Spanish (es)"), so every code parsed from
// an uploaded file is run through this before it's used anywhere. It's also
// applied defensively here in resolveRegionProfile, since this function is
// the shared gateway every code passes through on its way to a voice.
function normalizeLangCode(code){
  const raw = code ? String(code).trim() : '';
  if(!raw) return raw;
  const parts = raw.split('-');
  parts[0] = parts[0].toLowerCase();
  for(let i=1;i<parts.length;i++){ parts[i] = parts[i].toUpperCase(); }
  return parts.join('-');
}
function resolveRegionProfile(code){
  const norm = normalizeLangCode(code);
  const prefix = norm ? String(norm).split('-')[0] : 'en';
  const key = CODE_TO_REGION_KEY[norm] || CODE_TO_REGION_KEY[prefix] || prefix;
  return REGION_PROFILES[key] || REGION_PROFILES[prefix] || null;
}

// ------------------------------------------------------------------
// VOICE COVERAGE CHECK — the rule that keeps a newly-added language
// from silently failing to play.
// ------------------------------------------------------------------
// Root cause this check exists to catch: speak()/previewVoice() only
// attach a real browser voice (u.voice = v) when getVoiceCandidates()
// found at least one match. When it finds none, u.lang gets set to the
// *raw* unmatched code (e.g. "nv", "nah", "quz") with NO voice object
// attached — and several speechSynthesis engines (notably
// Chrome/Android) silently refuse to speak an utterance whose lang tag
// doesn't correspond to any installed voice when no explicit voice is
// given. Result: total silence, no error, nothing in the console —
// exactly what makes this bug easy to ship and hard to notice in
// testing (it can pass on a dev machine that happens to have a stray
// voice covering that prefix).
//
// THE RULE: every code in a course's `langs` must resolve — either
// directly (its own voiceLang prefix) or via CODE_TO_REGION_KEY ->
// REGION_PROFILES matchPrefixes — to at least one prefix in
// SAFE_VOICE_PREFIXES below, i.e. a language family with near-universal
// OS/browser TTS coverage. If it doesn't, that language MUST get a
// CODE_TO_REGION_KEY entry pointing to a REGION_PROFILES profile with
// alwaysApproximate:true and a matchPrefixes chain that ends in a safe
// prefix (see 'lo-th' / 'afr-en-ng' above for the pattern). This is not
// optional style guidance — it's checked below, at load time, for
// every course, so a gap can't ship unnoticed. When adapting this
// template for a new course, add every new language to BASE_LANGS
// FIRST, then reload — this check will tell you immediately, via a
// banner in the setup screen and a console.error, whether it also
// needs a CODE_TO_REGION_KEY / REGION_PROFILES entry before it's safe
// to ship.
const SAFE_VOICE_PREFIXES = [
  'en','es','fr','de','it','pt','ru','zh','ja','ko','ar','nl','pl',
  'sv','da','no','nb','fi','tr','el','he','hi','id','th','vi','cs',
  'hu','ro','sk','uk','bg','hr','ca','fil','ms'
];
// Returns an array of {code, label} for every language in `course.langs`
// that has no path to a SAFE_VOICE_PREFIXES-covered voice — i.e. would
// hit the silent-failure path described above.
function findUncoveredLanguages(course){
  const problems = [];
  (course.langs||[]).forEach(l=>{
    if(l.selectable===false) return;
    const profile = resolveRegionProfile(l.code);
    const prefix = String(l.code).split('-')[0];
    const chain = (profile && profile.matchPrefixes && profile.matchPrefixes.length) ? profile.matchPrefixes : [prefix];
    const covered = chain.some(p=>SAFE_VOICE_PREFIXES.includes(p));
    if(!covered) problems.push({code:l.code, label:l.label});
  });
  return problems;
}
// Shows a hard-to-miss banner (and logs to console) naming any language
// in the active course that fails the rule above, so a silent,
// untestable voice gap can't ship unnoticed.
function renderVoiceCoverageWarning(course){
  const el = document.getElementById('voiceCoverageWarning');
  if(!el) return;
  const problems = findUncoveredLanguages(course);
  if(!problems.length){ el.classList.add('hidden'); el.innerHTML=''; return; }
  const names = problems.map(p=>p.label||p.code).join(', ');
  console.error('[voice coverage] These languages have no fallback to a widely-available TTS voice and will likely play SILENTLY: '+names+'. Add a CODE_TO_REGION_KEY / REGION_PROFILES entry for each (see "VOICE COVERAGE CHECK" comment above resolveRegionProfile) before shipping.');
  el.innerHTML = `<b>Voice setup incomplete</b><br>${escapeHtml(names)} — no fallback voice configured. These will likely play silently until a CODE_TO_REGION_KEY / REGION_PROFILES entry is added. See console for details.`;
  el.classList.remove('hidden');
}
function preferExactNamesFirst(list, profile){
  const preferred = profile && profile.preferredNames;
  if(!preferred || !preferred.length) return list;
  const wanted = preferred.map(n=>n.toLowerCase());
  const hits = list.filter(v=>wanted.includes((v.name||'').toLowerCase()));
  if(!hits.length) return list;
  hits.sort((a,b)=> wanted.indexOf(a.name.toLowerCase()) - wanted.indexOf(b.name.toLowerCase()));
  const hitSet = new Set(hits);
  return [...hits, ...list.filter(v=>!hitSet.has(v))];
}
function loadVoices(){
  const prevCount = S.voices.length;
  S.voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  if(S.voices.length !== prevCount){
    renderCharacterCards();
    populateVoicesForOSHelp();
  }
}
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
  // onvoiceschanged doesn't fire reliably in every context (especially local
  // files), and the list can come back partial on the first tick. Keep polling
  // until the voice count stops changing so late-arriving voices (e.g. a
  // proper en-US voice that loads after a placeholder) still get picked up —
  // combined with the "only sticky once the user actually picks" rule in
  // renderCharacterCards, this keeps defaults from getting stuck on whatever
  // loaded first, the same fix used in the Luna player.
  let voiceCheckAttempts = 0;
  let lastVoiceCount = S.voices.length;
  const voiceCheckInterval = setInterval(()=>{
    voiceCheckAttempts++;
    const found = speechSynthesis.getVoices();
    if(found.length !== lastVoiceCount){
      lastVoiceCount = found.length;
      loadVoices();
      return;
    }
    if(found.length>0 || voiceCheckAttempts>=20){ clearInterval(voiceCheckInterval); }
  }, 250);
}
function voicesReady(timeoutMs=1500){
  return new Promise(resolve=>{
    if(!window.speechSynthesis){ resolve(false); return; }
    if(speechSynthesis.getVoices().length){ resolve(true); return; }
    const start = Date.now();
    const iv = setInterval(()=>{
      loadVoices();
      if(S.voices.length || Date.now()-start>timeoutMs){ clearInterval(iv); resolve(S.voices.length>0); }
    }, 150);
  });
}

// Voices with localService===false are served over the network rather than
// bundled on-device. On platforms with sparse local voice installs (notably
// iOS Safari), network-backed voices tend to be more consistently present
// across devices, so we float them to the front of an already-language-matched
// list. This is a soft preference, not a guarantee — some platforms (iOS
// again) only ever expose local voices, in which case this is a no-op.
function preferNetworkVoicesFirst(list){
  return [...list].sort((a,b)=>{
    const aNet = a.localService===false ? 0 : 1;
    const bNet = b.localService===false ? 0 : 1;
    return aNet - bNet;
  });
}

// Some languages have one regional variant that's the far-more-common default
// for learners than others — see REGION_PROFILES declared above, near
// loadVoices(), since it must be initialized before this runs.
function regionRank(voice, profile){
  if(!profile) return 2;
  const region = (voice.lang || '').split(/[-_]/)[1];
  const r = region ? region.toUpperCase() : '';
  if(profile.primary && r===profile.primary) return 0;
  if(profile.boost && profile.boost.includes(r)) return 1;
  if(profile.demote && profile.demote.includes(r)) return 3;
  return 2;
}
function preferRegionFirst(list, profile){
  return [...list].sort((a,b)=> regionRank(a, profile) - regionRank(b, profile));
}

// `code` is the selected language's own code (e.g. 'pt-BR', 'la-VA',
// 'ln') — NOT a resolved voiceLang — so it can be looked up in
// CODE_TO_REGION_KEY to find the right region profile even when several
// codes share a voice-search prefix or fall back to a different language.
function getVoiceCandidates(code, gender){
  const voices = S.voices;
  const normCode = normalizeLangCode(code);
  const profile = resolveRegionProfile(normCode);
  const prefix = normCode ? String(normCode).split('-')[0] : 'en';
  const matchPrefixes = (profile && profile.matchPrefixes && profile.matchPrefixes.length) ? profile.matchPrefixes : [prefix];
  let matches = [];
  let usingFallback = false;
  for(let i=0;i<matchPrefixes.length;i++){
    matches = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith(matchPrefixes[i]));
    if(matches.length){ usingFallback = i>0; break; }
  }
  matches = preferNetworkVoicesFirst(matches);
  matches = preferRegionFirst(matches, profile);
  // When a character's gender is known, float voices whose name reads as that
  // gender to the front of the match list — but only within the top-ranked
  // region tier (e.g. US), so a gender-matched voice from a non-preferred
  // region (e.g. en-GB) can never bump ahead of a preferred-region voice
  // that simply doesn't happen to match the gender guess. Only when the
  // preferred tier has no voices at all do we fall back to a global,
  // region-agnostic gender match.
  let genderMatched = false;
  if(gender==='male' || gender==='female'){
    const topRank = matches.length ? regionRank(matches[0], profile) : null;
    const topTier = topRank===null ? [] : matches.filter(v=>regionRank(v, profile)===topRank);
    const rest = topRank===null ? [] : matches.filter(v=>regionRank(v, profile)!==topRank);
    const tierHits = topTier.filter(v=>guessVoiceGender(v)===gender);
    if(tierHits.length){
      const hitSet = new Set(tierHits);
      matches = [...tierHits, ...topTier.filter(v=>!hitSet.has(v)), ...rest];
      genderMatched = true;
    } else if(topTier.length===0){
      const hits = matches.filter(v=>guessVoiceGender(v)===gender);
      if(hits.length){
        const hitSet = new Set(hits);
        matches = [...hits, ...matches.filter(v=>!hitSet.has(v))];
        genderMatched = true;
      }
    }
  }
  // Exact-name pin always wins last, regardless of region/gender ranking above.
  matches = preferExactNamesFirst(matches, profile);
  // Whether the top-ranked match is one of the regions we boost (e.g. US
  // English) — false means a language match exists but isn't the preferred
  // regional default (e.g. only Spain Spanish, or only Australian English,
  // is installed), which is worth a gentle nudge rather than the full
  // "no voice at all" warning. Only profiles with a defined boost list have
  // a "preferred" region at all — others are always considered matched.
  const hasPreference = !!(profile && profile.boost && profile.boost.length);
  const regionMatched = !hasPreference || matches.length===0 ? true : regionRank(matches[0], profile)===0;
  const alwaysApproximate = !!(profile && profile.alwaysApproximate);
  return {matches, usingFallback, voices, genderMatched, regionMatched, profile, alwaysApproximate};
}

/* Populates a <select> with every installed voice — matches for `code`
   (the selected language's own code, e.g. 'pt-BR', not a resolved
   voiceLang) float to the top and are marked, but nothing is ever hidden.
   When a gender is given, the best gender-matching voice for `code` (if
   any) becomes the top recommendation instead of just the first language
   match. */
function populateVoiceSelect(selectId, code, previousURI, gender){
  const sel = document.getElementById(selectId);
  if(!sel) return {chosenURI:'', matches:[], usingFallback:false, genderMatched:false};
  sel.innerHTML = '';
  const {matches, usingFallback, voices, genderMatched} = getVoiceCandidates(code, gender);
  const matchSet = new Set(matches);
  const ordered = [...matches, ...voices.filter(v=>!matchSet.has(v))];

  // BUGFIX (2026-09): when nothing installed actually matches this
  // language, don't silently pretend one does. The full voice list below
  // is still shown and still fully selectable -- a user can always
  // deliberately override with a mismatched voice on purpose -- but the
  // AUTO pick must not attach an arbitrary voice from a totally unrelated
  // language. A placeholder keeps the dropdown's own selection in sync
  // with that "nothing auto-picked" state instead of defaulting to
  // whichever voice happens to sort first.
  if(!matches.length){
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = '— no installed voice matches this language —';
    sel.appendChild(placeholder);
  }

  ordered.forEach(v=>{
    const o = document.createElement('option');
    const isMatch = matchSet.has(v);
    o.value = v.voiceURI;
    o.textContent = `${isMatch ? '\u2713 ' : ''}${v.name} (${v.lang})`;
    sel.appendChild(o);
  });

  let chosenURI = '';
  if(previousURI && voices.some(v=>v.voiceURI===previousURI)){
    chosenURI = previousURI;
  } else if(matches.length){
    chosenURI = matches[0].voiceURI;
  }
  // NOTE: intentionally NO "else if(voices.length) chosenURI = voices[0]"
  // fallback here anymore. Root cause of the "Arabic line plays in French
  // instead" bug: speak() attaches whatever voice object chosenURI points
  // to, and an attached voice's OWN .lang always overrides the utterance's
  // requested langCode. So auto-picking an unrelated installed voice (e.g.
  // the first voice alphabetically, which happened to be a French voice on
  // the device that was tested) didn't just mispronounce the Arabic line --
  // it replaced the language entirely. Leaving chosenURI blank here lets
  // speak() fall through to the raw language code with no forced voice,
  // so the browser can use its own default engine for that language
  // instead of one this template picked at random.
  sel.value = chosenURI;
  return {chosenURI, matches, usingFallback, genderMatched};
}

function updateDotAndNote(id, uri, matches, genderMatched, usingFallback, gender, langLabel){
  const isSrc = id.indexOf('srcVoice__')===0;
  const dot = document.getElementById('dot_'+id);
  const note = document.getElementById('note_'+id);
  const isRecommended = matches.length>0 && matches[0].voiceURI===uri;
  const noLangMatch = matches.length===0;
  if(dot) dot.className = 'dot' + (!uri ? '' : noLangMatch ? ' danger' : (isRecommended ? (isSrc?' amber':' teal') : ' white'));
  let text = '';
  if(!uri){
    // Can mean either "no TTS voices installed at all" or "voices exist,
    // just none for this language, and nothing's been manually picked yet"
    // (see the populateVoiceSelect bugfix note above) -- distinguish them.
    text = matches.length===0 ? `no ${langLabel || 'matching'} voice installed — pick one below to override` : 'no voice available on this device';
  } else if(noLangMatch){
    text = `no ${langLabel || 'matching'} voice installed on this device`;
  } else if(usingFallback){
    text = `no ${langLabel || 'this'} voice found — using a related language instead`;
  } else if(isRecommended){
    text = 'recommended pick';
  } else {
    text = 'custom pick';
  }
  if(note) note.textContent = text;
}

/* One character card = a name/role header + a source-voice select and a
   target-voice select, each scoped to that character alone. */
function renderCharacterCards(){
  const course = currentCourse();
  const wrap = document.getElementById('charactersList');
  wrap.innerHTML = '';
  const noSrc = !S.srcCode || S.srcCode===S.tgtCode;
  const srcLang = noSrc ? null : langByCode(course, S.srcCode);
  const tgtLang = langByCode(course, S.tgtCode);

  const srcVoiceLangCode = srcLang ? srcLang.voiceLang : 'en-US';
  const tgtVoiceLangCode = tgtLang ? tgtLang.voiceLang : 'en-US';
  // The *language* `code` (e.g. 'pt-BR', 'la-VA') drives voice defaults —
  // NOT srcVoiceLangCode/tgtVoiceLangCode above, which are only used for
  // the actual utterance's lang tag. Several codes share a voiceLang
  // (all three Latin registers resolve to 'la'; fr-FR/fr-AFR both resolve
  // to 'fr-FR'), so keying defaults off voiceLang can't tell them apart —
  // keying off `code` instead is also what lets switching between two
  // codes that share a voiceLang correctly count as a language change.
  const srcLangCode = srcLang ? srcLang.code : 'en';
  const tgtLangCode = tgtLang ? tgtLang.code : 'en';

  course.characters.forEach(ch=>{
    if(!S.charVoices[ch.code]) S.charVoices[ch.code] = {src:'', tgt:'', srcLang:'', tgtLang:'', srcUserPicked:false, tgtUserPicked:false, srcPitch:1, tgtPitch:1, srcPitchUserPicked:false, tgtPitchUserPicked:false};
    const cv = S.charVoices[ch.code];
    const charGender = guessCharGender(ch);
    const srcId = 'srcVoice__'+sanitizeId(ch.code);
    const tgtId = 'tgtVoice__'+sanitizeId(ch.code);

    const card = document.createElement('div');
    card.className = 'char-card';
    card.innerHTML = `
      <div class="char-head">
        <span class="char-name">${escapeHtml(ch.name)}</span>
        <span class="char-role-tag">${escapeHtml(ch.code)}</span>
        ${ch.role ? `<span class="char-role">— ${escapeHtml(ch.role)}</span>` : ''}
      </div>
      <div class="char-divider"></div>
      <div class="char-voice-row">
        <div class="voice-col">
          <div class="voice-label src"><span class="dot" id="dot_${srcId}"></span>Source voice</div>
          <select id="${srcId}"></select>
          <div class="voice-control-row src">
            <button type="button" class="voice-test-btn src" id="test_${srcId}" title="Preview this voice">Test ▶</button>
          </div>
          <div class="voice-note" id="note_${srcId}"></div>
        </div>
        <div class="voice-col">
          <div class="voice-label tgt"><span class="dot" id="dot_${tgtId}"></span>Target voice</div>
          <select id="${tgtId}"></select>
          <div class="voice-control-row tgt">
            <button type="button" class="voice-test-btn tgt" id="test_${tgtId}" title="Preview this voice">Test ▶</button>
          </div>
          <div class="voice-note" id="note_${tgtId}"></div>
        </div>
      </div>`;
    wrap.appendChild(card);
    // Pitch dropdowns are wired in a second pass below, once every
    // character's voice URI for this language pair is known — the
    // collision check needs the full picture first.

    if(noSrc){
      const sel = document.getElementById(srcId);
      sel.innerHTML = '<option value="">— no separate source voice needed —</option>';
      sel.disabled = true;
      cv.src = '';
      cv.srcLang = '';
      cv.srcUserPicked = false;
      const srcTestBtn = document.getElementById('test_'+srcId);
      if(srcTestBtn) srcTestBtn.disabled = true;
    } else {
      // Only trust the saved URI as a "keep my manual override" signal if the
      // user actually chose it themselves for this exact language — an
      // auto-picked default is never sticky, so as more voices finish loading
      // (e.g. a proper regional voice arriving after a placeholder), the pick
      // keeps improving instead of freezing on whatever loaded first.
      const prevSrcURI = (cv.srcUserPicked && cv.srcLang===srcLangCode) ? cv.src : '';
      const {chosenURI, matches, usingFallback:srcUsingFallback, genderMatched} = populateVoiceSelect(srcId, srcLangCode, prevSrcURI, charGender);
      cv.src = chosenURI;
      cv.srcLang = srcLangCode;
      updateDotAndNote(srcId, chosenURI, matches, genderMatched, srcUsingFallback, charGender, srcLang && srcLang.label);
      document.getElementById(srcId).onchange = e=>{
        cv.src = e.target.value;
        cv.srcLang = srcLangCode;
        cv.srcUserPicked = true;
        updateDotAndNote(srcId, e.target.value, matches, false, srcUsingFallback, charGender, srcLang && srcLang.label);
      };
      const srcTestBtn = document.getElementById('test_'+srcId);
      if(srcTestBtn) srcTestBtn.onclick = ()=> previewVoice(cv.src, srcVoiceLangCode, srcTestBtn, cv.srcPitch);
    }

    const prevTgtURI = (cv.tgtUserPicked && cv.tgtLang===tgtLangCode) ? cv.tgt : '';
    const {chosenURI:tURI, matches:tMatches, usingFallback, genderMatched:tGenderMatched} = populateVoiceSelect(tgtId, tgtLangCode, prevTgtURI, charGender);
    cv.tgt = tURI;
    cv.tgtLang = tgtLangCode;
    updateDotAndNote(tgtId, tURI, tMatches, tGenderMatched, usingFallback, charGender, tgtLang && tgtLang.label);
    document.getElementById(tgtId).onchange = e=>{
      cv.tgt = e.target.value;
      cv.tgtLang = tgtLangCode;
      cv.tgtUserPicked = true;
      updateDotAndNote(tgtId, e.target.value, tMatches, false, usingFallback, charGender, tgtLang && tgtLang.label);
    };
    const tgtTestBtn = document.getElementById('test_'+tgtId);
    if(tgtTestBtn) tgtTestBtn.onclick = ()=> previewVoice(cv.tgt, tgtVoiceLangCode, tgtTestBtn, cv.tgtPitch);
  });

  // Second pass: every character now has a resolved voice URI for both
  // sides, so this is the first point where a "two characters ended up on
  // the same underlying voice" collision can actually be detected. Nudge
  // pitch apart for anyone caught in a collision who hasn't manually set
  // their own pitch, then build/wire the dropdowns with the final values.
  applyVoiceCollisionPitch(course);
  course.characters.forEach(ch=>{
    const cv = S.charVoices[ch.code];
    const srcId = 'srcVoice__'+sanitizeId(ch.code);
    const tgtId = 'tgtVoice__'+sanitizeId(ch.code);
    setupPitchSelect(srcId, cv, 'srcPitch', 'srcPitchUserPicked');
    setupPitchSelect(tgtId, cv, 'tgtPitch', 'tgtPitchUserPicked');
  });
}

/* ============================================================
   VOICE-COLLISION PITCH NUDGING
   When two or more characters end up assigned the same underlying voice
   (same voiceURI) for a given side (source or target), that voice's own
   character can't do much to distinguish them — so nudge pitch apart just
   enough to tell them apart: male characters step down, female characters
   step up. A manual pitch pick on a character is always left alone. Non-
   manual pitches are reset to Mid first so a nudge from a previous
   language pairing doesn't linger once the voices no longer clash.
   ============================================================ */
const PITCH_MID = 1.00;
const PITCH_MALE_COLLISION = 0.90;
const PITCH_FEMALE_COLLISION = 1.10;
function applyVoiceCollisionPitch(course){
  ['src','tgt'].forEach(side=>{
    const uriKey = side;
    const pitchKey = side+'Pitch';
    const pickedKey = side+'PitchUserPicked';
    course.characters.forEach(ch=>{
      const cv = S.charVoices[ch.code];
      if(cv && !cv[pickedKey]) cv[pitchKey] = PITCH_MID;
    });
    const groups = {};
    course.characters.forEach(ch=>{
      const cv = S.charVoices[ch.code];
      const uri = cv && cv[uriKey];
      if(!uri) return;
      (groups[uri] = groups[uri] || []).push(ch);
    });
    Object.values(groups).forEach(group=>{
      if(group.length < 2) return; // no collision, nothing to distinguish
      group.forEach(ch=>{
        const cv = S.charVoices[ch.code];
        if(cv[pickedKey]) return; // respect a manual pick
        const gender = guessCharGender(ch);
        if(gender==='male') cv[pitchKey] = PITCH_MALE_COLLISION;
        else if(gender==='female') cv[pitchKey] = PITCH_FEMALE_COLLISION;
        // unknown gender: leave at Mid — no basis to pick a direction
      });
    });
  });
}

function populateVoicesForOSHelp(){
  const course = currentCourse();
  const tgtLang = langByCode(course, S.tgtCode);
  const code = tgtLang ? tgtLang.code : 'en';
  const {matches, usingFallback, regionMatched, profile, alwaysApproximate} = getVoiceCandidates(code);
  updateOSVoiceHelp(matches, usingFallback, alwaysApproximate, regionMatched, profile);
}

function updateListenNote(){
  const txt = S.style==='exposure'
    ? 'Hands-free: each line plays twice with a pause after each, then moves on automatically — no input needed.'
    : '';
  document.getElementById('listenNote').textContent = txt;
  const drillNote = document.getElementById('drillListenNote');
  if(drillNote) drillNote.textContent = txt;
}

/* Audio-check card removed from setup — its "Test audio" button and the
   listener that drove it are gone too, so this file no longer wires up
   testAudioBtn/audioTestResult at all. */

/* ============================================================
   SPEECH HELPERS
   ============================================================ */
function pickVoiceByURI(uri){
  return S.voices.find(v=>v.voiceURI===uri) || null;
}
// Seven-step pitch dropdown, replacing the old free-drag slider: Low sits
// at the bottom of the opened list, Mid (the default/neutral pitch) in the
// middle, High at the top — the rest are unlabeled step marks between them.
const PITCH_LEVELS = [
  {value:1.30, label:'High'},
  {value:1.20, label:'▲▲'},
  {value:1.10, label:'▲'},
  {value:1.00, label:'Mid'},
  {value:0.90, label:'▼'},
  {value:0.80, label:'▼▼'},
  {value:0.70, label:'Low'},
];
function nearestPitchLevel(v){
  let best = PITCH_LEVELS[3].value, bestDiff = Infinity;
  PITCH_LEVELS.forEach(p=>{
    const d = Math.abs(p.value - v);
    if(d < bestDiff){ bestDiff = d; best = p.value; }
  });
  return best;
}
// Wires a per-character, per-role pitch dropdown. Value lives on the passed
// state object (cv[key]) so it's read straight out of S.charVoices by
// speak()/previewVoice() later — same object, no separate lookup needed.
// A picked flag (cv[userPickedKey]) mirrors the voice-pick pattern above:
// once the user chooses a pitch themselves, auto adjustments (e.g. voice-
// collision nudging) leave it alone.
function setupPitchSelect(id, cv, key, userPickedKey){
  const sel = document.getElementById('pitch_'+id);
  if(!sel) return;
  sel.innerHTML = '';
  PITCH_LEVELS.forEach(p=>{
    const o = document.createElement('option');
    o.value = p.value;
    o.textContent = p.label;
    sel.appendChild(o);
  });
  sel.value = nearestPitchLevel(cv[key] || 1);
  sel.classList.toggle('adjusted', !cv[userPickedKey] && parseFloat(sel.value) !== PITCH_MID);
  sel.onchange = ()=>{
    cv[key] = parseFloat(sel.value);
    cv[userPickedKey] = true;
    sel.classList.remove('adjusted');
  };
}
// Plays a short sample through one specific voice, independent of the main
// practice-playback state (token/S.running), so a preview never gets caught
// up in — or interrupted by — the drill loop's own cancellation logic.
function previewVoice(uri, langCode, btn, pitch){
  if(!window.speechSynthesis || !uri) return;
  speechSynthesis.cancel();
  const v = pickVoiceByURI(uri);
  const u = new SpeechSynthesisUtterance('One, two, three.');
  u.rate = S.rate;
  u.pitch = pitch || 1;
  if(v){ u.voice = v; u.lang = v.lang; } else if(langCode){ u.lang = langCode; }
  if(btn) btn.disabled = true;
  const reset = ()=>{ if(btn) btn.disabled = false; };
  u.onend = reset;
  u.onerror = reset;
  speechSynthesis.speak(u);
}
function speak(text, langCode, token, voiceURI, pitch){
  return new Promise(resolve=>{
    if(!text || !window.speechSynthesis){ resolve(); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.rate = S.rate;
    u.pitch = pitch || 1;
    const v = pickVoiceByURI(voiceURI);
    if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = langCode; }
    let done = false, check, hardCeiling, started = false, missCount = 0;
    const finish = ()=>{
      if(done) return;
      done = true;
      clearInterval(check);
      clearTimeout(hardCeiling);
      resolve();
    };
    u.onstart = ()=>{ started = true; };
    u.onend = finish;
    u.onerror = (e)=>{ console.warn('[speech] utterance error', {langCode, voiceURI, error: e && e.error}); finish(); };
    speechSynthesis.speak(u);
    check = setInterval(()=>{
      if(token!==S.token){
        // BUGFIX (2026-09): don't cancel() here. Every caller that bumps
        // S.token (prevLessonBtn/nextLessonBtn, prevBtn/nextBtn, repeatBtn,
        // pause) already calls speechSynthesis.cancel() itself, synchronously,
        // BEFORE bumping the token and starting the next line. This interval
        // belongs to the OLD utterance and only ticks every 120ms, so by the
        // time it notices the token changed, the engine may already be a
        // few ms into speaking the NEW utterance under the new token. Calling
        // cancel() again here is a stale double-cancel that can silently wipe
        // out that brand-new utterance instead of the one this poll was
        // actually tracking. Network voices (e.g. Arabic) take longer to spin
        // up than local ones, so they're the most likely to still be starting
        // when this stale tick lands -- which is why this showed up as
        // "Arabic source line gets skipped on the first line after changing
        // lessons." Just stop polling and resolve; don't touch the engine.
        finish();
        return;
      }
      // WATCHDOG BUGFIX (2026-09): speechSynthesis.speaking is not a reliable
      // instant signal, and trusting a single false reading of it caused
      // random cutoffs at BOTH ends of a line:
      //  - START cutoff: right after speechSynthesis.speak(u) is called there
      //    is real startup latency -- worst on network/remote voices -- before
      //    the engine actually begins producing audio and `speaking` flips
      //    true. If this poll's very first tick landed in that gap, `speaking`
      //    still read false, so finish() fired immediately and the line was
      //    skipped before a single word played.
      //  - END cutoff: some engines briefly report `speaking === false` for a
      //    tick or two mid-utterance (e.g. at internal clause boundaries on
      //    longer lines) even though speech resumes right after. One false
      //    reading was enough to end the utterance early and chop off the
      //    tail of the line.
      // Fix: ignore the "not speaking" reading entirely until the real
      // onstart event has fired (kills the start-cutoff case), and require
      // two consecutive false readings -- 240ms apart -- before treating it
      // as genuinely finished (kills the mid-utterance blip / end-cutoff case).
      if(!started) return;
      if(!speechSynthesis.speaking){
        missCount++;
        if(missCount>=2) finish();
      } else {
        missCount = 0;
      }
    }, 120);
    // Hard ceiling as a last resort, scoped to just THIS one utterance --
    // unlike a global pause()/resume() nudge (tried and reverted: it wedged
    // the whole speechSynthesis queue permanently during testing), cancel()
    // on a single stuck utterance is the same safe cleanup call already
    // used everywhere else in this file (prevBtn/nextBtn/stopBtn etc.) and
    // never touches engine-wide state. Only fires if speechSynthesis.speaking
    // somehow gets stuck reporting true for a line that isn't actually
    // producing sound, so one bad line can't freeze the rest of the session.
    let ceilingExtensions = 0;
    const scheduleCeiling = (ms)=>{
      hardCeiling = setTimeout(()=>{
        if(done) return;
        if(!started && ceilingExtensions < 2){
          // Engine hasn't fired onstart yet -- most likely a slow-spinning-up
          // network voice, not a genuinely stuck one. Give it a couple of
          // short grace extensions instead of killing the line before it
          // ever made a sound. Capped at 2 (2.5s each) so a voice that
          // silently drops the utterance entirely -- a real glitch some
          // engines have when speak() is called in rapid back-to-back
          // succession, which is exactly what fast source/target switching
          // does -- can't stall the session forever; it still gets force-
          // cancelled and the drill moves on.
          ceilingExtensions++;
          scheduleCeiling(2500);
          return;
        }
        console.warn('[speech] watchdog: utterance never finished, cancelling', {langCode, voiceURI, started});
        speechSynthesis.cancel();
        finish();
      }, ms);
    };
    scheduleCeiling(Math.min(15000, estimateMs(text)*3 + 4000));
  });
}
function estimateMs(text){
  const words = (text||'').trim().split(/\s+/).filter(Boolean).length || 1;
  const secs = words / (2.3 * S.rate);
  return Math.max(500, Math.min(4200, secs*1000));
}
function sleep(ms, token){
  return new Promise(resolve=>{
    const start = Date.now();
    const iv = setInterval(()=>{
      if(token!==S.token || Date.now()-start>=ms){ clearInterval(iv); resolve(); }
    }, 80);
  });
}

let recognizer = null;
function tryStartRecognition(langCode){
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Ctor || !S.listenEnabled) return;
  try{
    recognizer = new Ctor();
    recognizer.lang = langCode;
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
    recognizer.onresult = (e)=>{
      const heard = e.results[0][0].transcript;
      document.getElementById('heardText').textContent = 'Heard: "'+heard+'"';
    };
    recognizer.onerror = ()=>{};
    recognizer.start();
  }catch(err){ /* silently ignore */ }
}
function stopRecognition(){
  if(recognizer){ try{ recognizer.stop(); }catch(e){} recognizer=null; }
}

/* Voice for a given line: falls back gracefully if a character has no
   dedicated source voice chosen. */
function voicesForEntry(entry){
  const cv = S.charVoices[entry.speaker] || {};
  const sameLang = !!cv.srcLang && cv.srcLang === cv.tgtLang;
  return {
    srcURI: cv.src || (sameLang ? cv.tgt : '') || '',
    tgtURI: cv.tgt || (sameLang ? cv.src : '') || '',
    srcPitch: cv.srcPitch || 1,
    tgtPitch: cv.tgtPitch || 1,
  };
}

/* ============================================================
   DRILL ENGINE
   ============================================================ */
document.getElementById('startBtn').addEventListener('click', async ()=>{
  if(S.activeLines.length===0){ alert('No lines available for that language combination.'); return; }
  await voicesReady();
  document.querySelectorAll('.setup-card').forEach(c=>c.classList.add('hidden'));
  show('drillScreen');
  updateLessonNavButtons();
  S.order = S.activeLines.map((_,i)=>i);
  if(S.random) shuffleOrder();
  S.idx = 0;
  S.attempt = 1;
  S.running = true;
  S.paused = false;
  S.linesCompleted = 0;
  S.sessionStart = Date.now();
  document.getElementById('drillRateSlider').value = S.rate;
  document.getElementById('drillRateVal').textContent = S.rate.toFixed(2)+'×';
  document.querySelectorAll('#drillStyleRow .toggle-pill').forEach(pl=>pl.classList.toggle('on', pl.dataset.val===S.style));
  updateListenNote();
  const supported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
  const wrap = document.getElementById('listenToggleWrap');
  wrap.innerHTML='';
  if(supported && S.style==='judge'){
    const b = document.createElement('button');
    b.className='btn ghost'; b.textContent='🎤 Try live listen-along: off';
    b.onclick = ()=>{ S.listenEnabled = !S.listenEnabled; b.textContent = '🎤 Try live listen-along: '+(S.listenEnabled?'on':'off'); };
    wrap.appendChild(b);
  }
  runLine(0);
});

function updateMilestone(){
  const total = S.activeLines.length;
  const cur = S.idx+1;
  document.getElementById('roadFill').style.width = Math.round((cur/total)*100)+'%';
  document.getElementById('capLeft').textContent = `Line ${cur} of ${total}`;
  document.getElementById('capRight').textContent = S.style==='judge' ? (S.attempt===2 ? 'attempt 2 of 2' : '') : '';
}

async function runLine(i){
  if(i<0 || i>=S.order.length){
    if(S.loop){
      if(S.random) shuffleOrder();
      i = 0;
    } else {
      finishSession();
      return;
    }
  }
  S.idx = i; S.attempt = 1;
  const myToken = ++S.token;
  const entry = S.activeLines[S.order[i]];
  updateMilestone();

  document.getElementById('speakerTag').textContent = entry.speaker || '\u00A0';
  document.getElementById('toneTag').textContent = entry.tone || '\u00A0';
  document.getElementById('sourceLineEl').textContent = entry.source || '';
  document.getElementById('targetLineEl').textContent = '';
  document.getElementById('yourTurn').classList.remove('show');
  document.getElementById('heardText').textContent = '';

  if(S.style==='exposure'){
    await runExposureLine(entry, myToken);
  } else {
    await runJudgedLine(entry, myToken, 1);
  }
}

async function runExposureLine(entry, token){
  const {srcURI, tgtURI, srcPitch, tgtPitch} = voicesForEntry(entry);
  setPhase('Listen');
  if(entry.source && S.sourceLangGuess){
    await speak(entry.source, S.sourceLangGuess, token, srcURI, srcPitch);
    if(token!==S.token) return;
    await sleep(Math.min(estimateMs(entry.target), 2000), token);
    if(token!==S.token) return;
  }
  document.getElementById('targetLineEl').textContent = entry.target;
  await speak(entry.target, S.targetLangGuess, token, tgtURI, tgtPitch);
  if(token!==S.token) return;
  await sleep(estimateMs(entry.target)*1.2, token);
  if(token!==S.token) return;
  setPhase('Once more');
  await speak(entry.target, S.targetLangGuess, token, tgtURI, tgtPitch);
  if(token!==S.token) return;
  await sleep(estimateMs(entry.target)*1.2, token);
  if(token!==S.token) return;
  S.linesCompleted++;
  advance();
}

async function runJudgedLine(entry, token, attempt){
  S.attempt = attempt;
  updateMilestone();
  const {srcURI, tgtURI, srcPitch, tgtPitch} = voicesForEntry(entry);
  if(attempt===1){
    setPhase('Listen');
    if(entry.source && S.sourceLangGuess){
      await speak(entry.source, S.sourceLangGuess, token, srcURI, srcPitch);
      if(token!==S.token) return;
      await sleep(Math.min(estimateMs(entry.target), 2000), token);
      if(token!==S.token) return;
    }
  } else {
    setPhase('One more time');
  }
  document.getElementById('targetLineEl').textContent = entry.target;
  await speak(entry.target, S.targetLangGuess, token, tgtURI, tgtPitch);
  if(token!==S.token) return;

  setPhase(attempt===1 ? 'Your turn' : 'Your turn — last try');
  document.getElementById('yourTurn').classList.add('show');
  document.getElementById('retryBtn').style.visibility = attempt===1 ? 'visible' : 'hidden';
  document.getElementById('heardText').textContent = '';
  tryStartRecognition(S.targetLangGuess==='la' ? 'it-IT' : S.targetLangGuess);

  const repeatPauseMs = estimateMs(entry.target)*1.5;

  if(attempt===1){
    await new Promise(resolve=>{
      let settled=false;
      const done = (verdict)=>{
        if(settled) return; settled=true;
        stopRecognition();
        document.getElementById('yourTurn').classList.remove('show');
        cleanup();
        resolve(verdict);
      };
      const passH = ()=>done('pass');
      const retryH = ()=>done('retry');
      const cleanup = ()=>{
        document.getElementById('passBtn').removeEventListener('click', passH);
        document.getElementById('retryBtn').removeEventListener('click', retryH);
      };
      document.getElementById('passBtn').addEventListener('click', passH);
      document.getElementById('retryBtn').addEventListener('click', retryH);
    }).then(verdict=>{
      if(token!==S.token) return;
      if(verdict==='pass'){ flashOK(); S.linesCompleted++; advance(); }
      else { runJudgedLine(entry, token, 2); }
    });
  } else {
    await new Promise(resolve=>{
      let settled=false;
      const done = ()=>{ if(settled) return; settled=true; stopRecognition(); cleanup(); resolve(); };
      const passH = ()=>done();
      document.getElementById('passBtn').addEventListener('click', passH);
      const cleanup = ()=>document.getElementById('passBtn').removeEventListener('click', passH);
      sleep(repeatPauseMs, token).then(done);
    });
    if(token!==S.token) return;
    document.getElementById('yourTurn').classList.remove('show');
    S.linesCompleted++;
    advance();
  }
}

function flashOK(){
  const stage = document.querySelector('.stage');
  stage.style.background='#E8F5E9';
  setTimeout(()=>{ stage.style.background=''; }, 300);
}
function setPhase(txt){ document.getElementById('phaseLabel').textContent = txt; }

function advance(){
  if(!S.running) return;
  runLine(S.idx+1);
}
function finishSession(){
  hide('drillScreen'); show('doneScreen');
  const mins = Math.max(1, Math.round((Date.now()-S.sessionStart)/60000));
  document.getElementById('doneStats').textContent =
    `${S.linesCompleted} line${S.linesCompleted===1?'':'s'} drilled in about ${mins} minute${mins===1?'':'s'}.`;
}

/* ---- transport controls ---- */
document.getElementById('playPauseBtn').addEventListener('click', ()=>{
  S.paused = !S.paused;
  document.getElementById('playPauseBtn').innerHTML = S.paused
    ? '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>'
    : '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>';
  if(S.paused){
    speechSynthesis.cancel();
    S.token++;
    setPhase('Paused');
  } else {
    runLine(S.idx);
  }
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  speechSynthesis.cancel(); stopRecognition();
  S.token++;
  runLine(Math.max(0, S.idx-1));
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  speechSynthesis.cancel(); stopRecognition();
  S.token++;
  runLine(Math.min(S.order.length-1, S.idx+1));
});
document.getElementById('repeatBtn').addEventListener('click', ()=>{
  speechSynthesis.cancel(); stopRecognition();
  S.token++;
  runLine(S.idx);
});
document.getElementById('loopBtn').addEventListener('click', ()=>{
  S.loop = !S.loop;
  document.getElementById('loopBtn').classList.toggle('active', S.loop);
});
document.getElementById('randomBtn').addEventListener('click', ()=>{
  S.random = !S.random;
  document.getElementById('randomBtn').classList.toggle('active', S.random);
  if(S.random) shuffleOrder();
});
document.getElementById('drillRateSlider').addEventListener('input', e=>{
  S.rate = parseFloat(e.target.value);
  document.getElementById('drillRateVal').textContent = S.rate.toFixed(2)+'×';
});
document.getElementById('stopBtn').addEventListener('click', ()=>{
  speechSynthesis.cancel(); stopRecognition();
  S.running = false; S.token++;
  finishSession();
});
document.getElementById('restartSameBtn').addEventListener('click', ()=>{
  hide('doneScreen'); show('drillScreen');
  if(S.random) shuffleOrder();
  S.idx = 0; S.running = true; S.paused=false; S.linesCompleted=0; S.sessionStart=Date.now();
  runLine(0);
});
document.getElementById('newSetupBtn').addEventListener('click', ()=>{
  hide('doneScreen');
  document.querySelectorAll('.setup-card').forEach(c=>c.classList.remove('hidden'));
});

/* keyboard shortcuts during judged 'your turn' */
document.addEventListener('keydown', e=>{
  if(!document.getElementById('yourTurn').classList.contains('show')) return;
  if(e.code==='Enter'){ document.getElementById('passBtn').click(); }
  if(e.code==='Space'){ e.preventDefault(); const r=document.getElementById('retryBtn'); if(r.style.visibility!=='hidden') r.click(); }
});

/* ============================================================
   INIT
   ============================================================ */
populateCourseSelect();
chooseDefaultLangsForCourse(currentCourse());
populateLangSelects();
populateSheetSelect();
S.rate = 0.92;
buildActiveLines();
renderCharacterCards();
updateSheetMeta();
populateVoicesForOSHelp();
updateListenNote();
renderVoiceCoverageWarning(currentCourse());
renderLangTiles();
</script>
