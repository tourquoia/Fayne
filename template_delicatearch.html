<!--
=====================================================================
INSTRUCTIONS FOR CLAUDE (any session, any user)
=====================================================================
This is a locked-down variant of the reusable player template: the
runtime "＋" spreadsheet loader (button, file input, column-picker
modal, course-setup modal, and their supporting XLSX-parsing code)
has been intentionally removed. This file only ever plays the
course(s) already baked into it at build time — do not re-add any
file-upload / "load a different course" capability unless the person
explicitly asks for it back.

If the person hands you a new spreadsheet and asks for a new
standalone build from this template, treat it the same as any other
from-scratch build request: ask them for DEFAULT SOURCE LANGUAGE,
DEFAULT TARGET LANGUAGE, and each character's GENDER before wiring
the spreadsheet's data into the COURSES array, since none of that
detection/setup machinery exists in this file anymore to do it for
you at runtime.
=====================================================================
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Hire Floor English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Code+Pro:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- Practice brand system: orange / white / black ----
       All former "amber" and "teal" tokens are kept (renaming every
       selector below would risk breaking something) but repointed to
       the new palette. Every *-glow* token is set to fully transparent
       so the old halo box-shadows compute to nothing, and --shadow is
       redefined as one flat elevation system used everywhere. */
    --bg:#FAFAFA;
    --bg-hi:#FAFAFA;
    --card:rgba(255,255,255,0.58);
    --card-hi:rgba(254,233,221,0.62);
    --border:#E7E1DC;
    --border-soft:#EFEAE5;
    --ink:#141414;
    --ink-soft:#5B5652;
    --ink-dim:#8C8680;
    --amber:#F05A22;
    --amber-bright:#C2410C;
    --amber-dim:#F6C8AE;
    --amber-glow: rgba(0,0,0,0);
    --amber-glow-soft: rgba(0,0,0,0);
    /* Vivid orange used for the transport/player control buttons and the
       big hero play button — same hue family as --amber, no separate
       glow ring. */
    --amber-vivid:#F05A22;
    --amber-vivid-glow: rgba(0,0,0,0);
    --amber-vivid-glow-soft: rgba(0,0,0,0);
    /* "teal" tokens formerly marked the target-language column with a
       second accent hue; the brand has no blue/teal, so these now sit
       in near-black instead, keeping the src/tgt visual distinction
       without introducing an off-brand color. */
    --teal:#141414;
    --teal-bright:#141414;
    --teal-dim:#D9D3CC;
    --teal-glow: rgba(0,0,0,0);
    --teal-glow-soft: rgba(0,0,0,0);
    --white-dot:#8C8680;
    --ok:#2E7D32;
    --danger:#B3261E;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.10);
    --radius-lg:18px;
    --radius-md:13px;
    /* Reserved clearance for a host-injected sticky/anchor ad bar at the
       bottom of the viewport. Bump this if the ad unit is taller. */
    --ad-safe-space:90px;
    --ease:150ms ease;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--bg-hi);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    min-height:100%;
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:16px 12px 24px;
  }
  .wrap{width:100%; max-width:520px;}
  /* Explicit spacer element (not padding) — trailing padding on a scrolling
     container like body is unreliably included in the scroll area on some
     browsers/OSes. A real element guarantees the space is always there and
     always scrollable-to, regardless of which screen (main/drill) is showing. */
  .ad-safe-spacer{ height: calc(80px + var(--ad-safe-space, 90px)); width:100%; flex:none; }

  /* ---- base card: amber neon-bordered dark panel ---- */
  .card{
    background:var(--card);
    border:1.5px solid #000;
    border-radius:var(--radius-lg);
    box-shadow:0 0 0 1px var(--amber-glow-soft), 0 0 30px -10px var(--amber-glow), var(--shadow);
    padding:14px 16px 13px;
    margin-bottom:14px;
    position:relative;
  }
  h2.section-title{
    font-family:'Inter', sans-serif;
    font-size:15px; font-weight:700; letter-spacing:-.01em;
    margin:0 0 8px; color:var(--ink);
  }
  summary.section-title{
    cursor:pointer; list-style:none; display:flex; align-items:center; justify-content:space-between;
    margin:0;
  }
  summary.section-title::-webkit-details-marker{ display:none; }
  summary.section-title .chev{ font-size:13px; color:var(--amber); transition:transform var(--ease); }
  details[open] > summary.section-title .chev{ transform:rotate(180deg); }
  details[open] > summary.section-title{ margin-bottom:10px; }
  details > .details-body{ padding-top:2px; }
  .summary-hint{ font-size:10.5px; color:var(--ink-dim); font-weight:400; font-style:normal; font-family:'Inter',inherit; margin-left:6px; }
  .eyebrow-label{
    font-family:'Source Code Pro', monospace;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-dim); margin:0 0 6px;
  }

  label.field-label{
    display:block; font-size:10px; font-weight:600; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:.1em; margin:8px 0 4px;
    font-family:'Source Code Pro', monospace;
  }
  label.field-label:first-child{margin-top:0;}
  select, input[type=text], input[type=number], textarea{
    width:100%; font-family:'Inter', inherit; font-size:13.5px;
    padding:8px 10px; border-radius:9px;
    border:1.5px solid var(--border); background:rgba(255,255,255,0.58);
    color:var(--ink);
  }
  select:focus, input:focus, textarea:focus{ outline:2px solid var(--amber-dim); outline-offset:1px; }
  select option{ background:#FFFFFF; color:var(--ink); }

  /* ---- language selector row ---- */
  .lang-grid{ display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:end;
    border-top:1px solid var(--border-soft); margin-top:10px; padding-top:12px; }
  .lang-col{ border-left:3px solid var(--amber); padding-left:10px; }
  .lang-col.tgt{ border-left-color:var(--teal); }
  .lang-col .eyebrow-label.src{ color:var(--amber-bright); }
  .lang-col .eyebrow-label.tgt{ color:var(--teal-bright); }
  #srcLangSelect, #tgtLangSelect{ font-size:15px; font-weight:700; padding:9px 10px; border-color:var(--border-soft); background:rgba(255,255,255,0.58); }
  .swap-btn{
    width:34px; height:34px; border-radius:50%;
    border:1.5px solid var(--amber-dim); background:rgba(255,255,255,0.58); color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; margin-bottom:6px; transition:color var(--ease), border-color var(--ease);
  }
  .swap-btn:hover{ color:var(--amber-bright); border-color:var(--amber); }

  /* ---- characters ---- */
  .char-card{
    background:var(--card-hi);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-md);
    padding:9px 12px 8px;
    margin-bottom:8px;
  }
  .char-card:last-child{ margin-bottom:0; }
  .char-head{ display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
  .char-name{ font-family:'Inter', sans-serif; font-weight:700; font-size:15px; letter-spacing:-.01em; }
  .char-role-tag{ font-family:'Source Code Pro', monospace; font-size:10px; color:var(--ink-dim); letter-spacing:.08em; text-transform:uppercase; }
  .char-role{ font-size:11.5px; color:var(--ink-soft); }
  .char-divider{ display:none; }
  .char-voice-row{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; }
  .voice-col{ min-width:0; }
  .voice-label{ display:flex; align-items:center; font-family:'Source Code Pro', monospace; font-size:9.5px;
    letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px; color:var(--ink-soft); white-space:nowrap; }
  .voice-label.src{ color:var(--amber-bright); }
  .voice-label.tgt{ color:var(--teal-bright); }
  .dot{ width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:6px; background:var(--ink-dim); flex:none; box-shadow:0 0 6px 0 currentColor; }
  .dot.amber{ background:var(--amber); color:var(--amber); }
  .dot.teal{ background:var(--teal); color:var(--teal); }
  .dot.white{ background:var(--white-dot); color:transparent; box-shadow:none; }
  .dot.danger{ background:var(--danger); color:var(--danger); }
  .voice-control-row{ display:flex; align-items:center; gap:6px; margin-top:4px; }
  .voice-note{ font-family:'Source Code Pro', monospace; font-size:9px; color:var(--ink-dim); width:100%; margin-top:4px; }
  .voice-test-btn{
    flex:none; padding:5px 10px; margin-top:-1px;
    border-radius:7px; border:1px solid var(--border); background:rgba(255,255,255,0.58);
    color:var(--ink-soft); font-size:11px; font-weight:600; line-height:1.2; cursor:pointer;
    font-family:'Inter', inherit; white-space:nowrap;
    display:flex; align-items:center; gap:4px; justify-content:center;
  }
  .voice-test-btn:hover{ color:var(--ink); border-color:var(--ink-dim); }
  .voice-test-btn.src:hover{ color:var(--amber-bright); border-color:var(--amber-dim); }
  .voice-test-btn.tgt:hover{ color:var(--teal-bright); border-color:var(--teal-dim); }
  .voice-test-btn:disabled{ opacity:.35; cursor:default; }
  .voice-test-btn:disabled:hover{ color:var(--ink-soft); border-color:var(--border); }
  .char-voice-row select{ font-size:12px; padding:7px 8px; width:100%; }

  /* ---- course / section row ---- */
  .course-row{ display:flex; gap:8px; align-items:flex-end; }
  .course-row > div:first-child{ flex:1; }
  /* ---- unified button system: primary / secondary / ghost ---- */
  .btn{
    font-family:'Inter', inherit; font-weight:700; font-size:13px;
    padding:9px 15px; border-radius:10px; border:1.5px solid #000;
    background:var(--amber); color:#FFFFFF; cursor:pointer;
    box-shadow:var(--shadow);
    transition:background var(--ease), color var(--ease), border-color var(--ease), filter var(--ease);
  }
  .btn:hover{ filter:brightness(1.06); }
  .btn.secondary{
    background:rgba(255,255,255,0.58); color:var(--amber-bright); border-color:#000;
    box-shadow:none;
  }
  .btn.secondary:hover{ background:var(--card-hi); filter:none; }
  /* Was transparent border — invisible against the orange artwork behind
     the drill screen. A black border keeps "Once more" readable as a
     button there instead of floating text. */
  .btn.ghost{ background:rgba(255,255,255,0.58); border-color:#000; color:var(--ink-soft); box-shadow:none; }
  .btn.ghost:hover{ color:var(--ink); background:var(--border-soft); filter:none; }
  .btn.block{ width:100%; padding:11px; font-size:14px; margin-top:10px; }
  .btn-icon{ padding:8px 11px; line-height:1; flex:none; }
  .btn:disabled{ opacity:.4; cursor:default; filter:none; }
  .sheet-meta{ font-size:11px; color:var(--ink-dim); margin-top:4px; }
  .course-row-mini{ display:flex; gap:8px; align-items:flex-end; }
  .course-row-mini > div:first-child{ flex:1; min-width:0; }

  /* ---- hero "start practice" panel (now also holds the lesson grid) ---- */
  .hero-card{
    background:linear-gradient(160deg, #FFFFFF 0%, var(--card-hi) 100%);
    border:1.5px solid var(--amber);
    border-radius:var(--radius-lg);
    box-shadow:0 0 0 1px var(--amber-glow-soft), 0 0 44px -10px var(--amber-glow), var(--shadow);
    padding:20px 18px 18px;
    margin-bottom:14px;
    position:relative;
  }
  .hero-start-btn{
    display:flex; flex-direction:column; align-items:center; gap:14px; width:100%;
    background:transparent; border:none; margin:0; padding:0;
    cursor:pointer; text-align:center;
  }
  .hero-eyebrow{
    display:inline-flex; align-items:center;
    font-family:'Inter', inherit; font-size:13px; font-weight:800;
    letter-spacing:.1em; text-transform:uppercase; color:#FFFFFF;
    background:var(--amber); padding:5px 12px; border-radius:999px;
    line-height:1.2;
  }
  .hero-play-wrap{ position:relative; flex:none; width:86px; height:86px; }
  .hero-play{
    position:relative; z-index:1;
    flex:none; width:86px; height:86px; border-radius:50%;
    background:var(--amber-vivid); border:none;
    color:#FFFFFF; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; padding-left:3px;
  }
  .hero-text{ display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0; }
  .hero-title{
    font-family:'Inter', inherit; font-size:13px; font-weight:600;
    color:var(--ink-soft); line-height:1.3;
  }
  .hero-stats{
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:5px;
    font-size:11px; color:var(--ink-soft); margin-top:2px;
  }
  .hero-stats .sep{ color:var(--ink-dim); }
  .hero-start-btn:hover .hero-play{ filter:brightness(1.1); }
  .hero-lessons-grid{ margin-top:18px; }

  /* ---- lessons: horizontal scroll strip of pills ---- */
  .lessons-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .lessons-header .eyebrow-label{ margin:0; }
  .lessons-grid{
    display:flex; flex-wrap:nowrap; gap:8px; overflow-x:auto; padding-bottom:4px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .lessons-grid::-webkit-scrollbar{ display:none; }
  .lesson-tile{
    display:flex; align-items:center; gap:6px; flex:none;
    border:1.5px solid var(--border); border-radius:999px;
    background:rgba(255,255,255,0.58); color:var(--ink-soft);
    padding:8px 14px; font-size:12.5px; font-weight:600;
    font-family:'Inter', inherit; cursor:pointer; white-space:nowrap;
    transition:border-color var(--ease), color var(--ease), background var(--ease);
  }
  .lesson-tile .num{ color:var(--ink-dim); font-weight:700; flex:none; }
  .lesson-tile .lbl{ overflow:hidden; text-overflow:ellipsis; }
  .lesson-tile:hover{ border-color:var(--amber-dim); color:var(--ink); }
  .lesson-tile.active{ border-color:var(--amber); color:#FFFFFF; background:var(--amber); }
  .lesson-tile.active .num{ color:rgba(255,255,255,.75); }
  .lesson-tile.active .check{ margin-left:2px; color:#FFFFFF; font-size:12px; flex:none; }
  .lesson-tile.locked{ opacity:.4; cursor:default; }
  .lesson-tile.locked:hover{ border-color:var(--border); color:var(--ink-soft); }

  /* ---- toggle pills ---- */
  .toggle-row{ display:flex; gap:6px; }
  .toggle-pill{
    flex:1; padding:8px 10px; border-radius:9px; border:1.5px solid var(--border);
    background:rgba(255,255,255,0.58); color:var(--ink-soft); font-size:12.5px; font-weight:600; cursor:pointer;
    transition:background var(--ease), color var(--ease), border-color var(--ease);
  }
  .toggle-pill.on{ background:var(--amber); border-color:var(--amber); color:#FFFFFF; }

  .rate-row{ display:flex; align-items:center; gap:10px; }
  .rate-row input[type=range]{ flex:1; accent-color:var(--amber); }
  .rate-row span{ font-family:'Source Code Pro', monospace; font-size:12px; color:var(--ink-soft); width:40px; text-align:right; }

  .note{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; line-height:1.45; }
  .note.warn{ background:#FFF4EC; border:1px solid #F0B98C; color:#8A4B1F; border-radius:10px; padding:10px 12px; }
  .speech-warn{ font-size:11.5px; color:var(--danger); margin-top:5px; display:none; }
  .speech-warn.show{ display:block; }
  .hidden{ display:none !important; }

  /* ---- drill screen ---- */
  .drill-wrap{ width:100%; max-width:520px; }

  .player-nav{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px; }
  .nav-btn{
    display:flex; align-items:center; gap:6px;
    height:36px; padding:0 14px; border-radius:18px;
    border:1.5px solid #000; background:var(--card); color:var(--ink-soft);
    font-family:'Source Code Pro', monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    cursor:pointer; white-space:nowrap;
    transition:color var(--ease), border-color var(--ease);
  }
  .nav-btn .arrow{ display:inline-flex; align-items:center; line-height:1; }
  .nav-btn:hover{ color:var(--ink); border-color:var(--amber); }
  .nav-btn:disabled{ opacity:.3; cursor:default; }
  .nav-btn:disabled:hover{ color:var(--ink-soft); border-color:var(--amber-dim); }
  .nav-btn.nav-home{
    flex:none; width:40px; height:40px; padding:0; border-radius:50%; justify-content:center;
    border-color:#000; background:var(--card-hi); font-size:15px;
  }
  .nav-btn.nav-home:hover{ border-color:var(--amber); }
  .nav-btn.nav-home .home-icon{ display:flex; color:var(--amber-bright); }

  /* ---- player-nav: back/forward are quiet icon-only circles (matching
     the transport controls below); home + lesson dropdown are the
     prominent, primary controls in the middle ---- */
  .player-nav{ position:relative; }
  .player-nav .icon-btn{ flex:none; }
  .home-pill-wrap{ position:relative; flex:1 1 auto; min-width:0; }
  .nav-btn.nav-home-pill{
    flex:1 1 auto; min-width:0; width:auto; border-radius:999px; justify-content:center;
    border-color:#000; background:var(--card-hi); color:var(--ink);
    font-family:'Inter', inherit; font-size:12.5px; font-weight:700; letter-spacing:0;
    text-transform:none; gap:8px; overflow:hidden;
  }
  .nav-btn.nav-home-pill span:not(.chev){ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-btn.nav-home-pill:hover{ border-color:var(--amber); }
  .nav-btn.nav-home-pill .home-icon{ display:flex; color:var(--amber-bright); }
  .nav-btn.nav-home-pill .chev{ display:flex; color:var(--ink-soft); }
  .home-dropdown-list{
    position:absolute; top:calc(100% + 6px); left:50%; transform:translateX(-50%);
    background:#FFFFFF; border:1.5px solid var(--border); border-radius:12px;
    box-shadow:var(--shadow); padding:6px; min-width:150px; z-index:30;
  }
  .home-dropdown-item{
    padding:8px 12px; border-radius:8px; font-size:13.5px; color:#000000;
    cursor:pointer; white-space:nowrap;
  }
  .home-dropdown-item:hover{ background:var(--border-soft); color:#000000; }
  .home-dropdown-item.active{ background:#FEE9DD; color:var(--amber-bright); font-weight:700; }
  .home-dropdown-more{ text-align:center; padding:6px 0 2px; color:var(--ink-dim); font-size:12px; letter-spacing:.1em; }
  .home-dropdown-list{ max-height:280px; overflow-y:auto; }
  /* wide variant: used for the home-screen lesson dropdown, which hangs
     off a full-width pill rather than a small nav button */
  .home-dropdown-list.wide{ left:0; right:0; transform:none; min-width:auto; width:100%; }

  /* ---- speaking rate card (always-visible, above collapsible settings) ---- */
  .rate-card{ background:var(--card-hi); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:10px; }

  /* ---- grouped sub-sections inside the "Languages & Characters" card ---- */
  .subgroup-label{
    font-family:'Source Code Pro', monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-dim); margin:16px 0 8px;
  }
  .subgroup-label:first-child{ margin-top:0; }
  .char-pair-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .drill-lang-card{
    background:var(--card-hi); border:1px solid var(--border-soft); border-radius:12px;
    padding:10px 12px; margin-top:10px;
  }
  .drill-lang-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .drill-lang-row .lang-col{ border-left:3px solid var(--amber); padding-left:8px; }
  .drill-lang-row .lang-col.tgt{ border-left-color:var(--teal); }
  .drill-lang-row select{ font-size:13px; padding:7px 8px; }

  .milestone{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .road{ flex:1; }
  .track{ height:6px; border-radius:5px; background:var(--border-soft); overflow:hidden; }
  .fill{ height:100%; background:var(--amber); border-radius:5px; transition:width var(--ease); }
  .cap{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-dim); margin-top:5px; font-family:'Source Code Pro', monospace; }

  /* ---- drill stage: instrument panel, not a flashcard ---- */
  .stage{
    background:var(--card); border:1.5px solid var(--border); border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    position:relative; padding:44px 18px 26px; text-align:center; min-height:150px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  }
  .speaker-tag{
    position:absolute; top:14px; left:14px;
    font-family:'Source Code Pro', monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--amber-bright); background:var(--card-hi); padding:5px 11px; border-radius:999px;
  }
  .tone-tag{ font-size:12px; color:var(--ink-dim); }
  .phase-label{
    position:absolute; top:14px; right:14px;
    font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em;
    font-family:'Source Code Pro', monospace; background:var(--border-soft); padding:5px 11px; border-radius:999px;
    transition:background var(--ease), color var(--ease);
  }
  .source-line{ font-size:15px; color:var(--ink-soft); margin-top:2px; }
  .target-line{ font-family:'Inter', sans-serif; font-size:30px; font-weight:800; letter-spacing:-.01em; line-height:1.2; color:var(--ink); margin-top:4px; min-height:34px; }
  @media (max-width:400px){ .target-line{ font-size:26px; } }

  .your-turn{ display:none; flex-direction:column; align-items:center; gap:10px; margin-top:10px; }
  .your-turn.show{ display:flex; }
  .mic-pulse{ width:12px; height:12px; border-radius:50%; background:var(--amber); animation:micpulse 1.1s ease-in-out infinite; }
  @keyframes micpulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.55; transform:scale(1.25); } }
  .small-muted{ font-size:12px; color:var(--ink-dim); }
  .heard{ font-size:13px; color:var(--ink-soft); min-height:16px; }
  .judge-btns{ display:flex; gap:10px; }
  .judge-btns .btn{ padding:9px 14px; font-size:13px; }

  .transport{ display:flex; align-items:center; justify-content:center; gap:16px; margin-top:16px; flex-wrap:wrap; }
  .transport-main{ display:flex; align-items:center; gap:10px; }
  .transport-secondary{ display:flex; align-items:center; gap:6px; padding-left:14px; border-left:1px solid var(--border); }
  @media (max-width:360px){ .transport-secondary{ padding-left:0; border-left:none; } }
  .icon-btn{
    width:40px; height:40px; border-radius:50%; border:1.5px solid #000;
    background:rgba(255,255,255,0.58); color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow);
    transition:background var(--ease), color var(--ease), border-color var(--ease), transform var(--ease);
  }
  .icon-btn.primary{
    width:52px; height:52px;
    background:var(--amber); border-color:#000; color:#FFFFFF;
  }
  /* Was transparent border/background — on the arch's orange artwork these
     were nearly invisible. A black border keeps them visible against any
     part of the background while still reading as "secondary" controls. */
  .icon-btn.small{ width:32px; height:32px; border:1.5px solid #000; background:rgba(255,255,255,0.58); box-shadow:none; }
  .icon-btn:hover{ border-color:var(--amber); color:var(--amber-bright); transform:translateY(-1px); }
  .icon-btn.primary:hover{ filter:brightness(1.06); color:#FFFFFF; }

  .settings-panel{ background:var(--card-hi); border:1px solid var(--border-soft); border-radius:12px; padding:10px 12px; margin-top:10px; }
  .icon-btn.active{
    background:var(--card-hi); border-color:#000; color:var(--amber-bright);
  }
  .icon-btn.active:hover{ color:var(--amber-bright); }

  .drill-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:16px; flex-wrap:wrap; gap:10px; }

  .done{ text-align:center; }
  .done h2{ font-family:'Inter', sans-serif; font-weight:700; font-size:26px; letter-spacing:-.01em; margin:0 0 8px; color:var(--ink); }

  /* ---- column picker modal ---- */
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(4,5,6,.78);
    align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal-overlay.show{ display:flex; }
  .modal-card{
    /* Opaque here (not var(--card)) — this sits on the dark modal scrim,
       not the arch artwork, so translucency would just look muddy. */
    background:#FFFFFF; border:1.5px solid var(--amber-dim); border-radius:var(--radius-lg);
    box-shadow:0 0 0 1px var(--amber-glow-soft), 0 0 40px -10px var(--amber-glow), var(--shadow);
    padding:22px 22px 20px; width:100%; max-width:420px;
    max-height:calc(100vh - 40px); display:flex; flex-direction:column;
  }
  .modal-card h2{ font-family:'Inter', sans-serif; font-weight:700; letter-spacing:-.01em;
    font-size:19px; margin:0 0 6px; color:var(--ink); flex:none; }
  .modal-sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 14px; line-height:1.5; flex:none; }
  .colopt-list{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px;
    overflow-y:auto; min-height:0; flex:1 1 auto; }
  .colopt-row{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    border:1.5px solid var(--border); border-radius:10px; background:rgba(255,255,255,0.58);
    font-size:14px; cursor:pointer;
  }
  .colopt-row:hover{ border-color:var(--amber-dim); }
  .colopt-row input{ accent-color:var(--amber); width:16px; height:16px; flex:none; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; flex:none; }
  .colopt-confirm-btn{ padding:22px 16px; font-size:16px; }
  .colopt-confirm-top{ width:100%; margin:0 0 14px; flex:none; }

  /* ---- course setup modal (defaults + gender confirm on new-course load) ---- */
  .modal-card.wide{ max-width:480px; }
  .setup-modal-body{ overflow-y:auto; min-height:0; flex:1 1 auto; margin-bottom:14px; }
  .gender-list{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .gender-row{ border:1.5px solid var(--border); border-radius:10px; padding:9px 11px; background:rgba(255,255,255,0.58); }
  .gender-row-name{ font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px; display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
  .gender-guess-note{ font-family:'Source Code Pro', monospace; font-size:9px; color:var(--ink-dim); font-weight:400; margin-left:auto; text-transform:uppercase; letter-spacing:.04em; }
  .gender-options{ display:flex; gap:14px; font-size:12.5px; color:var(--ink-soft); }
  .gender-options label{ display:flex; align-items:center; gap:5px; cursor:pointer; }
  .gender-options input{ accent-color:var(--amber); width:14px; height:14px; }

  /* ---- lesson picker pill (home screen) — now a real button that opens
     a working dropdown of lessons, using the same list/item styling as
     the player screen's lesson dropdown ---- */
  .home-lesson-picker-wrap{ position:relative; margin-bottom:16px; }
  .lesson-picker-pill{
    display:flex; align-items:center; gap:10px; width:100%;
    background:var(--card); border:1.5px solid #000;
    border-radius:14px; padding:12px 14px; margin:0;
    box-shadow:var(--shadow); cursor:pointer;
    font-family:'Inter', inherit; text-align:left;
  }
  .lesson-picker-icon{ flex:none; display:flex; color:var(--ink-soft); }
  .lesson-picker-text{ flex:1; font-family:'Inter', inherit; font-size:15px; font-weight:600; color:var(--ink); }
  .lesson-picker-chev{ flex:none; color:var(--ink-soft); display:flex; transition:transform var(--ease); }
  .home-lesson-picker-wrap.open .lesson-picker-chev{ transform:rotate(180deg); }

  /* ---- target-language chooser (home screen "I speak X" tiles) ----
     Appears under a language tile when a course has more than one
     possible language to work on for that source language. */
  .lang-target-chooser{
    display:flex; flex-direction:column; gap:6px;
    margin:-4px 0 12px; padding:10px 12px 4px;
  }
  .lang-target-chooser .lang-target-hint{
    font-family:'Source Code Pro', monospace; font-size:10.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-dim); margin-bottom:2px;
  }
  .lang-target-option{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; text-align:left; font-family:'Inter', inherit; font-size:13.5px; font-weight:600;
    color:var(--ink); background:rgba(255,255,255,0.58); border:1.5px solid var(--border);
    border-radius:10px; padding:9px 12px; cursor:pointer;
    transition:border-color var(--ease), color var(--ease);
  }
  .lang-target-option:hover{ border-color:var(--amber); color:var(--amber-bright); }

  /* ---- language tile list (home screen "I speak X" launcher) ---- */
  .lang-tile-list{ display:flex; flex-direction:column; gap:12px; }
  .lang-tile{
    display:flex; align-items:center; gap:14px; width:100%;
    background:linear-gradient(135deg, var(--amber-bright) 0%, var(--amber) 100%);
    border:1.5px solid #000; border-radius:16px; padding:14px 16px;
    color:#FFFFFF; text-align:left; cursor:pointer;
    box-shadow:var(--shadow);
    font-family:'Inter', inherit;
    transition:filter var(--ease), transform var(--ease);
  }
  .lang-tile:hover{ filter:brightness(1.05); }
  .lang-tile:active{ transform:scale(.99); }
  .lang-tile.ghost-tile{ background:linear-gradient(135deg, var(--amber-bright) 0%, var(--amber) 100%); }
  .lang-tile-icon{
    flex:none; width:44px; height:44px; border-radius:50%;
    background:#FFFFFF; display:flex; align-items:center; justify-content:center;
    font-size:22px; line-height:1; overflow:hidden;
  }
  .lang-tile-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .lang-tile-title{ font-size:17px; font-weight:800; letter-spacing:-.01em; }
  .lang-tile-sub{ font-size:12.5px; color:rgba(255,255,255,.85); }
  .lang-tile-chev{ flex:none; color:rgba(255,255,255,.85); display:flex; }

  /* ---- top bar ---- */
  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:center;
    width:100%; box-sizing:border-box;
    padding:14px max(12px, calc((100% - 520px)/2));
    margin-bottom:16px;
    background:var(--amber);
    box-shadow:0 1px 0 rgba(0,0,0,.08), var(--shadow);
  }
  .topbar-word{
    font-family:'Inter', sans-serif; font-weight:800; font-size:16px; letter-spacing:-.01em;
    color:#FFFFFF; text-align:center; line-height:1.25;
  }

  /* ---- setup drawer ---- */
  .drawer-overlay{
    position:fixed; inset:0; background:rgba(20,20,20,.35);
    opacity:0; pointer-events:none; transition:opacity var(--ease); z-index:49;
  }
  .drawer-overlay.show{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:360px; max-width:100%;
    background:var(--bg); box-shadow:-8px 0 24px -12px rgba(0,0,0,.18);
    transform:translateX(100%); transition:transform var(--ease); z-index:50;
    display:flex; flex-direction:column;
    overflow:hidden; /* clips the cloned arch artwork below at the drawer edge */
  }
  .drawer.open{ transform:translateX(0); }
  @media (max-width:400px){ .drawer{ width:100%; } }
  /* Same arch artwork, cloned in by JS (see NEW UI CHROME) so it shows
     through the setup drawer's own gaps the same way it does on the main
     screen. Sits above the drawer's solid page-color background but below
     the drawer-head/drawer-body content, mirroring .brand-arch-bg's
     relationship to <body>. */
  .drawer-arch-bg{
    position:absolute; left:0; bottom:0; width:100%;
    z-index:-1; pointer-events:none;
    display:flex; justify-content:center;
    transform:translateY(12%);
  }
  .drawer-arch-bg img{
    width:min(634px, 132vw); max-width:none; height:auto; display:block;
  }
  /* Matches .brand-arch-bg's mobile override: natural-proportion sizing so
     the artwork's own white sky stays visible above the arch, instead of
     zooming in to a wall of orange. */
  @media (max-width:700px){
    .drawer-arch-bg{ transform:translateY(0%); }
    .drawer-arch-bg img{ width:100vw; }
  }
  .drawer-head{
    flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; background:var(--amber);
  }
  .drawer-title{ font-family:'Inter', sans-serif; font-weight:700; font-size:14px; color:#FFFFFF; }
  .drawer-head .icon-btn{ color:#FFFFFF; }
  .drawer-head .icon-btn:hover{ border-color:rgba(255,255,255,.6); color:#FFFFFF; background:rgba(255,255,255,.15); }
  .drawer-body{ flex:1 1 auto; overflow-y:auto; padding:14px 16px 32px; -webkit-overflow-scrolling:touch; }
  .drawer-body .card{ margin-bottom:12px; }

  /* Shared background artwork — fixed to the viewport (not the scrolling
     page), so it shows through on the setup screen and the drill screen
     alike, anywhere a card/section isn't sitting on top of it. Lives at
     z-index:-1: above the plain page background, below every real
     element, and never intercepts taps (pointer-events:none). */
  .brand-arch-bg{
    position:fixed; left:0; bottom:0; width:100%;
    z-index:-1; pointer-events:none;
    display:flex; justify-content:center;
    /* Nudged down ~12% so less of the top of the arch gets clipped by the
       viewport edge; shrunk by a matching ~12% so we don't lose the orange
       at the bottom in the process. */
    transform:translateY(12%);
  }
  .brand-arch-bg img{
    width:min(634px, 132vw); max-width:none; height:auto; display:block;
  }
  /* On phone widths, show the artwork close to its natural proportions
     (roughly full viewport width, bottom-anchored) instead of zoomed in —
     this keeps the image's own broad white sky visible above the arch,
     so the page reads as roughly half white / half orange-artwork rather
     than a wall of orange. */
  @media (max-width:700px){
    .brand-arch-bg{ transform:translateY(0%); }
    .brand-arch-bg img{ width:100vw; }
  }
</style>
</head>
<body>

<!-- Shared brand artwork: fixed to the viewport, sits behind the hero card and every screen — visible in the gaps and empty space, covered up wherever a real element sits on top of it. -->
<div class="brand-arch-bg" aria-hidden="true"><img src="arch.png" alt=""></div>

<!-- ===================== TOP BAR ===================== -->
<header class="topbar">
  <span class="topbar-word">Fayne's Mini Language Courses</span>
</header>

<div class="wrap">

  <!-- ===================== START PRACTICE (lesson picker + language launcher) ===================== -->
  <section class="setup-card" id="homeScreen">
    <div class="home-lesson-picker-wrap" id="homeLessonPickerWrap">
      <button type="button" class="lesson-picker-pill" id="homeLessonPickerBtn" title="Choose lesson">
        <span class="lesson-picker-icon"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5A2.5 2.5 0 0 1 4.5 2H9a2 2 0 0 1 2 2v16a1.5 1.5 0 0 0-1.5-1.5H2z"></path><path d="M22 4.5A2.5 2.5 0 0 0 19.5 2H15a2 2 0 0 0-2 2v16a1.5 1.5 0 0 1 1.5-1.5H22z"></path></svg></span>
        <span class="lesson-picker-text" id="lessonPickerText">Lesson 1 of 20</span>
        <span class="lesson-picker-chev"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
      </button>
      <div class="home-dropdown-list wide hidden" id="homeLessonDropdownList"><!-- populated by renderLessonDropdownInto() --></div>
    </div>

    <div class="lang-tile-list" id="langTileList"><!-- populated by renderLangTiles() from the course's actual languages --></div>

    <!-- hidden — kept so existing JS bindings (id references) still resolve; -->
    <!-- this screen's visible UI is now the lesson-picker pill (dropdown)    -->
    <!-- + language tile launcher above, not the old scrolling lesson strip. -->
    <div class="hidden">
      <button id="startBtn"></button>
      <span id="heroLessonTitle">Lesson 1: Meeting Someone</span>
      <span id="heroStats"></span>
      <select id="courseSelect"></select>
      <div id="sheetMeta"></div>
      <div id="courseLoadNote"></div>
      <div class="lessons-grid hero-lessons-grid" id="lessonsGrid"></div>
    </div>
  </section>

  <!-- ===================== DRILL SCREEN ===================== -->
  <section id="drillScreen" class="drill-wrap hidden">
    <div class="player-nav">
      <button class="icon-btn" id="prevLessonBtn" title="Previous lesson"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <button class="nav-btn nav-home" id="playerHomeBtn" title="Home">
        <span class="home-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7"></path><path d="M9 22V12h6v10"></path></svg></span>
      </button>
      <div class="home-pill-wrap">
        <button class="nav-btn nav-home-pill" id="lessonDropdownBtn" title="Choose lesson">
          <span id="playerHomeLabel">Lesson 1 of 20</span>
          <span class="chev"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></span>
        </button>
        <div class="home-dropdown-list hidden" id="homeDropdownList"><!-- populated by renderLessonDropdownInto() --></div>
      </div>
      <button class="icon-btn" id="nextLessonBtn" title="Next lesson"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
    </div>
    <div class="stage">
      <div class="speaker-tag" id="speakerTag">&nbsp;</div>
      <div class="tone-tag" id="toneTag">&nbsp;</div>
      <div class="phase-label" id="phaseLabel">Getting ready…</div>
      <div class="source-line" id="sourceLineEl"></div>
      <div class="target-line" id="targetLineEl"></div>

      <div class="your-turn" id="yourTurn">
        <div class="mic-pulse"></div>
        <div class="small-muted">Your turn — say it out loud</div>
        <div class="heard" id="heardText"></div>
        <div class="judge-btns" id="judgeBtns">
          <button class="btn" id="passBtn">Got it</button>
          <button class="btn ghost" id="retryBtn">Once more</button>
        </div>
      </div>
    </div>

    <div class="transport">
      <div class="transport-main">
        <button class="icon-btn" id="prevBtn" title="Previous line"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg></button>
        <button class="icon-btn primary" id="playPauseBtn" title="Play / Pause"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg></button>
        <button class="icon-btn" id="nextBtn" title="Skip to next line"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg></button>
      </div>
      <div class="transport-secondary">
        <button class="icon-btn small" id="repeatBtn" title="Repeat this line"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 .49-9.36L1 10"></path></svg></button>
        <button class="icon-btn small active" id="loopBtn" title="Loop (on by default — repeats from the start when finished, handy for hands-free)"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg></button>
        <button class="icon-btn small" id="randomBtn" title="Shuffle line order"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg></button>
        <button class="icon-btn small" id="stopBtn" title="End session"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg></button>
      </div>
    </div>

    <!-- hidden — kept so existing JS bindings (id references) still resolve; -->
    <!-- this simple duo is now mirrored from the language-pair card below   -->
    <div class="hidden">
      <select id="drillSrcLangSelect"></select>
      <select id="drillTgtLangSelect"></select>
    </div>

    <div class="rate-card" id="settingsPanel">
      <label class="field-label" style="margin-top:0;">Speaking rate</label>
      <div class="rate-row">
        <input type="range" id="drillRateSlider" min="0.6" max="1.4" step="0.05" value="0.92">
        <span id="drillRateVal">0.92×</span>
      </div>
    </div>

    <div class="card" style="margin-top:10px;">
      <details>
        <summary class="section-title">Advanced<span class="chev">▾</span></summary>
        <div class="details-body">

          <div class="subgroup-label">Language pair</div>
          <div class="lang-grid" style="margin-top:0; padding-top:0; border-top:none;">
            <div class="lang-col src">
              <div class="eyebrow-label src">Source language</div>
              <select id="srcLangSelect"></select>
            </div>
            <button class="swap-btn" id="swapBtn" title="Swap source and target"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><line x1="3" y1="5" x2="21" y2="5"></line><polyline points="7 23 3 19 7 15"></polyline><line x1="21" y1="19" x2="3" y2="19"></line></svg></button>
            <div class="lang-col tgt">
              <div class="eyebrow-label tgt">Target language</div>
              <select id="tgtLangSelect"></select>
            </div>
          </div>
          <div class="note warn hidden" id="osVoiceHelp"></div>
          <div class="note warn hidden" id="voiceCoverageWarning"></div>

          <div class="subgroup-label">Characters &amp; voices</div>
          <div id="charactersList"></div>

          <div class="subgroup-label">Session style</div>
          <div class="toggle-row" id="drillStyleRow">
            <button class="toggle-pill on" data-val="exposure">Hands-free</button>
            <button class="toggle-pill" data-val="judge">Slow practice</button>
          </div>
          <div class="note hidden" id="drillListenNote"></div>

        </div>
      </details>
    </div>

    <!-- Line-progress bar — pushed all the way down here, below Advanced,
         out of the way. It's a nice-to-have for anyone who wants it, but
         not important enough to sit up near the top of the screen. -->
    <div class="milestone" style="margin-top:10px;">
      <div class="road">
        <div class="track"><div class="fill" id="roadFill" style="width:0%"></div></div>
        <div class="cap"><span id="capLeft">Line 1 of 1</span><span id="capRight" class="small-muted"></span></div>
      </div>
    </div>

    <div class="drill-foot">
      <div id="listenToggleWrap"></div>
    </div>
  </section>

  <!-- ===================== DONE SCREEN ===================== -->

const CHAR_GENDER_TOKENS = {
  female: ['WOMAN','GIRL','MOTHER','MOM','MAMA','MAMAN','WIFE','SISTER','DAUGHTER','QUEEN','PRINCESS','LADY','MRS','MS','MISS','FEMALE','F','SHE','HER','GIRLFRIEND','AUNT','GRANDMOTHER','GRANDMA','NIECE','BRIDE'],

};
function guessCharGender(ch){
  if(!ch) return 'unknown';
  if(ch.gender==='male' || ch.gender==='female') return ch.gender;
  const tokens = (String(ch.code||'')+' '+String(ch.name||'')).toUpperCase().split(/[^A-Z]+/).filter(Boolean);
  if(tokens.some(t=>CHAR_GENDER_TOKENS.female.includes(t))) return 'female';
  if(tokens.some(t=>CHAR_GENDER_TOKENS.male.includes(t))) return 'male';
  return 'unknown';
}

function guessVoiceGender(voice){
  if(!voice || !voice.name) return 'unknown';
  const name = voice.name.toLowerCase();
  if(/\bfemale\b/.test(name)) return 'female';
  if(/\bmale\b/.test(name)) return 'male';
  const words = name.split(/[^a-z]+/).filter(Boolean);
  if(words.some(w=>VOICE_GENDER_NAME_TOKENS.female.includes(w))) return 'female';
  if(words.some(w=>VOICE_GENDER_NAME_TOKENS.male.includes(w))) return 'male';
  return 'unknown';
}

function stripTags(raw){
  if(raw===null||raw===undefined) return {clean:'', tags:[]};
  let text = String(raw);
  const tags = [];
  text = text.replace(/\[([^\]]+)\]/g, (m,g)=>{ tags.push(g); return ''; });
  text = text.replace(/\.\.\.\s*$/,'').trim();
  text = text.replace(/\s{2,}/g,' ').trim();
  return {clean:text, tags};
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function titleCase(s){
  return String(s).toLowerCase().replace(/(^|\s)\w/g, m=>m.toUpperCase());
}
function sanitizeId(s){ return String(s).replace(/[^a-zA-Z0-9_]/g,'_'); }

function show(id){ document.getElementById(id).classList.remove('hidden'); }

function populateCourseSelect(){
  const sel = document.getElementById('courseSelect');
  sel.innerHTML = '';
  COURSES.forEach((c,i)=>{
    const o = document.createElement('option'); o.value=i; o.textContent = c.title; sel.appendChild(o);
  });
  sel.value = S.courseIdx;
  sel.onchange = ()=>{ switchCourse(parseInt(sel.value,10)); };
}

function chooseDefaultLangsForCourse(course){
  const has = code => !!langByCode(course, code);
  // A course loaded through the setup modal carries its own confirmed
  // defaults (course.defaultTgt/defaultSrc, with defaultSrc possibly '' for
  // "target only") — those always win over the global fallback constants,
  // which exist only for the built-in demo course that never goes through
  // that modal.
  const selectableLangs = course.langs.filter(l=>l.selectable!==false);
  const wantTgt = course.defaultTgt || DEFAULT_TGT;
  S.tgtCode = has(wantTgt) ? wantTgt : (selectableLangs[0]||course.langs[0]).code;
  if(course.defaultSrc !== undefined){
    S.srcCode = (course.defaultSrc && has(course.defaultSrc) && course.defaultSrc!==S.tgtCode) ? course.defaultSrc : '';
    return;
  }
  if(has(DEFAULT_SRC) && DEFAULT_SRC!==S.tgtCode){
    S.srcCode = DEFAULT_SRC;
  } else {
    const alt = selectableLangs.find(l=>l.code!==S.tgtCode);
    S.srcCode = alt ? alt.code : '';
  }
}

function switchCourse(idx){
  S.courseIdx = idx;
  S.sheetIdx = 0;
  S.charVoices = {};
  chooseDefaultLangsForCourse(currentCourse());
  populateLangSelects();
  populateSheetSelect();
  buildActiveLines();
  renderCharacterCards();
  updateSheetMeta();
  populateVoicesForOSHelp();
  updateListenNote();
  renderVoiceCoverageWarning(currentCourse());
}

function fillLangOptions(selectEl, course, allowNone){
  selectEl.innerHTML = allowNone ? '<option value="">— none (target only) —</option>' : '';
  course.langs.forEach(l=>{
    if(l.selectable===false) return;
    const o = document.createElement('option'); o.value=l.code; o.textContent=l.label; selectEl.appendChild(o);
  });
}

function populateLangSelects(){
  const course = currentCourse();
  const srcSel = document.getElementById('srcLangSelect');
  const tgtSel = document.getElementById('tgtLangSelect');
  fillLangOptions(srcSel, course, true);
  fillLangOptions(tgtSel, course, false);
  srcSel.value = S.srcCode;
  tgtSel.value = S.tgtCode;
  srcSel.onchange = ()=>{ S.srcCode = srcSel.value; syncDrillLangSelects(); onDrillLangChange(); };
  tgtSel.onchange = ()=>{ S.tgtCode = tgtSel.value; syncDrillLangSelects(); onDrillLangChange(); };

  // drill-screen mirrors of the same two selects (own listeners are bound once, elsewhere)
  const dSrcSel = document.getElementById('drillSrcLangSelect');
  const dTgtSel = document.getElementById('drillTgtLangSelect');
  fillLangOptions(dSrcSel, course, true);
  fillLangOptions(dTgtSel, course, false);
  dSrcSel.value = S.srcCode;
  dTgtSel.value = S.tgtCode;
}

function syncDrillLangSelects(){
  document.getElementById('drillSrcLangSelect').value = S.srcCode;
  document.getElementById('drillTgtLangSelect').value = S.tgtCode;
}
function syncMainLangSelects(){
  document.getElementById('srcLangSelect').value = S.srcCode;
  document.getElementById('tgtLangSelect').value = S.tgtCode;
}

document.getElementById('swapBtn').addEventListener('click', ()=>{
  const srcSel = document.getElementById('srcLangSelect');
  const tgtSel = document.getElementById('tgtLangSelect');
  if(!srcSel.value) return;
  const s = srcSel.value, t = tgtSel.value;
  srcSel.value = t; tgtSel.value = s;
  S.srcCode = srcSel.value; S.tgtCode = tgtSel.value;
  Object.keys(S.charVoices).forEach(code=>{
    const cv = S.charVoices[code];
    const tmpURI = cv.src; cv.src = cv.tgt; cv.tgt = tmpURI;
    const tmpLang = cv.srcLang; cv.srcLang = cv.tgtLang; cv.tgtLang = tmpLang;
    const tmpPicked = cv.srcUserPicked; cv.srcUserPicked = cv.tgtUserPicked; cv.tgtUserPicked = tmpPicked;
    const tmpPitch = cv.srcPitch; cv.srcPitch = cv.tgtPitch; cv.tgtPitch = tmpPitch;
    const tmpPitchPicked = cv.srcPitchUserPicked; cv.srcPitchUserPicked = cv.tgtPitchUserPicked; cv.tgtPitchUserPicked = tmpPitchPicked;
  });
  syncDrillLangSelects();
  onDrillLangChange();
});

function onDrillLangChange(){
  speechSynthesis.cancel(); stopRecognition();
  S.token++;
  const priorRow = S.order.length ? S.order[S.idx] : 0; // absolute row this session was on
  buildActiveLines();
  renderCharacterCards();
  updateSheetMeta();
  populateVoicesForOSHelp();
  updateListenNote();
  S.order = S.activeLines.map((_,i)=>i);
  if(S.random) shuffleOrder();
  if(S.order.length===0){
    finishSession();
    return;
  }
  // resume at the same row position if it still exists, else the nearest valid one
  let resumeAt = S.order.indexOf(priorRow);
  if(resumeAt===-1) resumeAt = Math.min(S.idx, S.order.length-1);
  document.getElementById('yourTurn').classList.remove('show');
  if(S.running && !S.paused){
    runLine(Math.max(0, resumeAt));
  } else {
    S.idx = Math.max(0, resumeAt);
    updateMilestone();
  }
}

function populateSheetSelect(){
  const course = currentCourse();
  const grid = document.getElementById('lessonsGrid');
  grid.innerHTML = '';
  // Fill top-to-bottom within a column, then wrap to the next column, so the
  // numbering reads 1,2,3... down the first column instead of across rows.
  const numRows = Math.ceil(course.sheets.length / 2);
  grid.style.gridTemplateRows = `repeat(${numRows}, auto)`;
  course.sheets.forEach((sh,i)=>{
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'lesson-tile' + (i===S.sheetIdx ? ' active' : '');
    tile.innerHTML = `<span class="num">${i+1}.</span><span class="lbl">${escapeHtml(sh.name)}</span>` +
      (i===S.sheetIdx ? '<span class="check">✓</span>' : '');
    tile.addEventListener('click', ()=>{
      if(S.sheetIdx===i) return;
      S.sheetIdx = i;
      buildActiveLines();
      renderCharacterCards();
      updateSheetMeta();
      populateVoicesForOSHelp();
      updateListenNote();
      populateSheetSelect();
    });
    grid.appendChild(tile);
  });
}
function updateLessonNavButtons(){
  const course = currentCourse();
  document.getElementById('prevLessonBtn').disabled = S.sheetIdx<=0;
  document.getElementById('nextLessonBtn').disabled = S.sheetIdx>=course.sheets.length-1;
}

function goToLesson(newIdx){
  const course = currentCourse();
  if(newIdx<0 || newIdx>=course.sheets.length) return;
  speechSynthesis.cancel(); stopRecognition();
  S.token++;
  S.sheetIdx = newIdx;
  buildActiveLines();
  renderCharacterCards();
  updateSheetMeta();
  populateVoicesForOSHelp();
  updateListenNote();
  populateSheetSelect();
  updateLessonNavButtons();
  if(S.activeLines.length===0){ alert('No lines available for that language combination in this lesson.'); return; }
  S.order = S.activeLines.map((_,i)=>i);
  if(S.random) shuffleOrder();
  S.idx = 0; S.attempt = 1;
  S.running = true; S.paused = false;
  S.linesCompleted = 0; S.sessionStart = Date.now();
  document.getElementById('yourTurn').classList.remove('show');
  runLine(0);
}
document.getElementById('prevLessonBtn').addEventListener('click', ()=> goToLesson(S.sheetIdx-1));
document.getElementById('nextLessonBtn').addEventListener('click', ()=> goToLesson(S.sheetIdx+1));

/* Shared dropdown renderer — builds a list of lesson entries into any
   dropdown-list element, highlighting the current lesson, and calling
   back with the chosen index. Used by both the player screen's lesson
   dropdown and the home screen's lesson picker, so they share the same
   wiring and only differ in what happens when a lesson is chosen. */
function renderLessonDropdownInto(listEl, onSelect){
  const course = currentCourse();
  listEl.innerHTML = '';
  course.sheets.forEach((sh,i)=>{
    const item = document.createElement('div');
    item.className = 'home-dropdown-item' + (i===S.sheetIdx ? ' active' : '');
    item.textContent = `${i+1}. ${sh.name}`;
    item.addEventListener('click', ()=>{
      listEl.classList.add('hidden');
      if(i!==S.sheetIdx) onSelect(i);
    });
    listEl.appendChild(item);
  });
}

/* ============================================================
   HOME SCREEN — language launcher tiles
   Built from the current course's actual `langs` list (minus
   whatever S.tgtCode is), so this never drifts out of sync with
   whatever languages a given course build actually ships with.
   Add a code to LANG_DISPLAY to give it a native self-referential
   phrase + flag; anything missing falls back to a plain
   "I speak {label}" line so a new course still gets a working tile.
   ============================================================ */
const LANG_DISPLAY = {
  'es':     {flag:'🇪🇸', phrase:'Yo hablo español'},
  'en':     {flag:'🇺🇸', phrase:'I speak English'},
  'pt':     {flag:'🇵🇹', phrase:'Eu falo português'},
  'pt-BR':  {flag:'🇧🇷', phrase:'Eu falo português'},
  'fr':     {flag:'🇫🇷', phrase:'Je parle français'},
  'fr-AFR': {flag:'🇫🇷', phrase:'Je parle français'},
  'de':     {flag:'🇩🇪', phrase:'Ich spreche Deutsch'},
  'it':     {flag:'🇮🇹', phrase:'Parlo italiano'},
  'vi':     {flag:'🇻🇳', phrase:'Tôi nói tiếng Việt'},
  'sw':     {flag:'🇰🇪', phrase:'Ninaongea Kiswahili'},
  'ar':     {flag:'🇸🇦', phrase:'أتحدث العربية'},
};
const CHEVRON_RIGHT_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

function renderLangTiles(){
  const course = currentCourse();
  const wrap = document.getElementById('langTileList');
  if(!wrap) return;
  wrap.innerHTML = '';
  // The course has one fixed "hub" language that every other language
  // pairs against (e.g. this is an ESL course, so the hub is English —
  // "Yo hablo español" always means Spanish→English, no choice needed).
  // That hub tile is the one exception: it goes last, and since a
  // hub-language speaker could work on ANY of the other installed
  // languages, tapping it asks which one instead of guessing.
  const hubCode = course.defaultTgt || DEFAULT_TGT;
  const hubLang = langByCode(course, hubCode);
  const hubLabel = hubLang ? hubLang.label : hubCode;
  const others = course.langs.filter(l=>l.code!==hubCode);
  const orderedTiles = hubLang ? [...others, hubLang] : others;
  orderedTiles.forEach(l=>{
    const isHub = l.code===hubCode;
    const disp = LANG_DISPLAY[l.code] || {flag:'🌐', phrase:`I speak ${l.label}`};
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'lang-tile';
    btn.innerHTML = `
      <span class="lang-tile-icon">${disp.flag}</span>
      <span class="lang-tile-text">
        <span class="lang-tile-title">${escapeHtml(disp.phrase)}</span>
        <span class="lang-tile-sub">${isHub ? 'Choose a language to work on' : `${escapeHtml(l.label)} → ${escapeHtml(hubLabel)}`}</span>
      </span>
      <span class="lang-tile-chev">${CHEVRON_RIGHT_SVG}</span>`;
    if(isHub){
      btn.addEventListener('click', ()=> toggleTargetChooser(btn, l.code, others));
    } else {
      btn.addEventListener('click', ()=> chooseLanguageAndStart(l.code, hubCode));
    }
    wrap.appendChild(btn);
  });
}

/* Opens (or closes) an inline chooser under a language tile, listing
   every other installed language as a "work on" option. Which languages
   show up here — and whether this ever appears at all — depends
   entirely on how many languages the current spreadsheet build has. */
function toggleTargetChooser(tileBtn, srcCode, candidates){
  const existing = tileBtn.nextElementSibling;
  if(existing && existing.classList.contains('lang-target-chooser')){
    existing.remove();
    return;
  }
  document.querySelectorAll('.lang-target-chooser').forEach(el=>el.remove());
  const chooser = document.createElement('div');
  chooser.className = 'lang-target-chooser';
  chooser.innerHTML = `<div class="lang-target-hint">Which language would you like to work on?</div>`;
  candidates.forEach(t=>{
    const disp = LANG_DISPLAY[t.code] || {flag:'🌐'};
    const opt = document.createElement('button');
    opt.type = 'button';
    opt.className = 'lang-target-option';
    opt.innerHTML = `<span>${escapeHtml(t.label)}</span><span>${disp.flag}</span>`;
    opt.addEventListener('click', ()=> chooseLanguageAndStart(srcCode, t.code));
    chooser.appendChild(opt);
  });
  tileBtn.insertAdjacentElement('afterend', chooser);
}
function chooseLanguageAndStart(srcCode, tgtCode){
  S.srcCode = srcCode;
  if(tgtCode) S.tgtCode = tgtCode;
  syncMainLangSelects();
  syncDrillLangSelects();
  onLangChange();
  document.getElementById('startBtn').click();
}

function estimateSessionMinutes(){
  const SEC_PER_LINE = 9; // matches the template's ~40-line / ~6-minute reference session
  return Math.max(1, Math.round(S.activeLines.length * SEC_PER_LINE / 60));
}

  updateHero();
}

function buildActiveLines(){
  const course = currentCourse();
  const sh = course.sheets[S.sheetIdx];
  const tgtColIdx = course.langs.findIndex(l=>l.code===S.tgtCode) + 1;
  const srcColIdx = S.srcCode ? (course.langs.findIndex(l=>l.code===S.srcCode) + 1) : -1;
  const list = [];
  for(const row of sh.rows){
    const rawTarget = row[tgtColIdx];
    if(!rawTarget || !String(rawTarget).trim()) continue;
    const t = stripTags(rawTarget);
    const s = srcColIdx>=0 && srcColIdx!==tgtColIdx ? stripTags(row[srcColIdx]) : {clean:'', tags:[]};
    list.push({
      speaker: row[0] || '',
      tone: t.tags[0] || s.tags[0] || '',
      source: s.clean,
      target: t.clean,
    });
  }
  S.activeLines = list;
  const tgtLang = langByCode(course, S.tgtCode);
  S.targetLangGuess = tgtLang ? tgtLang.voiceLang : 'en-US';
  const srcLang = S.srcCode ? langByCode(course, S.srcCode) : null;
  S.sourceLangGuess = (srcLang && S.srcCode!==S.tgtCode) ? srcLang.voiceLang : null;
}

/* ============================================================
   OS VOICE-INSTALL HELP — localized to whatever source language
   is currently selected (falls back to English if none/unmatched)
   ============================================================ */
function detectOS(){
  const ua = (navigator.userAgent || '') + ' ' + (navigator.platform || '');
  if(/CrOS/i.test(ua)) return 'chromeos';
  if(/iPhone|iPad|iPod/i.test(ua)) return 'ios';
  if(/Android/i.test(ua)) return 'android';
  if(/Win/i.test(ua)) return 'windows';
  if(/Mac/i.test(ua)) return 'mac';
  if(/Linux/i.test(ua)) return 'linux';
  return 'unknown';
}
function uiLangKeyFor(code){
  if(!code) return 'en';
  if(code.startsWith('es')) return 'es';
  if(code.startsWith('it')) return 'it';
  if(code.startsWith('fr')) return 'fr';
  if(code.startsWith('pt')) return 'pt';
  if(code.startsWith('ro')) return 'ro';
  return 'en';
}

      unknown: 'Revisa la configuraci\u00f3n de accesibilidad o de voz de tu dispositivo para la opci\u00f3n de {region}.',
    },
    after: 'Esto es solo el valor predeterminado \u2014 despu\u00e9s puedes elegir otro acento para cada personaje si lo prefieres.',
  },
};

function updateOSVoiceHelp(candidates, usingFallback, alwaysApproximate, regionMatched, profile){
  const el = document.getElementById('osVoiceHelp');
  const shaky = usingFallback || alwaysApproximate || candidates.length===0;
  const uiKey = uiLangKeyFor(S.srcCode || S.tgtCode);
  const course = currentCourse();
  const targetName = (langByCode(course, S.tgtCode)||{}).label || S.tgtCode;
  const os = detectOS();

  if(!shaky && !regionMatched){
    // A voice IS installed for this language, just not the region we'd
    // recommend by default (e.g. Spain Spanish instead of US/Latin America,
    // or Australian English instead of US) — nudge toward installing that
    // one specifically, since the OS's own "download a voice" list sorts
    // alphabetically and doesn't flag which accent is the sensible default.
    const label = (profile && profile.label && profile.label[uiKey]) || (profile && profile.label && profile.label.en);
    if(label){
      const n = REGION_NUDGE_I18N[uiKey] || REGION_NUDGE_I18N.en;
      const osLine = (n.os[os] || n.os.unknown).split('{region}').join(escapeHtml(label));
      const bodyLine = n.body.split('{region}').join(escapeHtml(label));
      el.innerHTML = `<b>${n.title}${escapeHtml(targetName)}</b><br>${bodyLine}<br>\u2022 ${osLine}<br><span class="small-muted">${n.after}</span>`;
      el.classList.remove('hidden');
      return;
    }
  }

  if(!shaky){ el.classList.add('hidden'); el.innerHTML=''; return; }
  const t = VOICE_HELP_I18N[uiKey] || VOICE_HELP_I18N.en;
  const osLine = t.os[os] || t.os.unknown;
  el.innerHTML = `<b>${t.title}${escapeHtml(targetName)}?</b><br>${t.body}<br>\u2022 ${osLine}<br><span class="small-muted">${t.after}</span>`;
  el.classList.remove('hidden');
}

/* ============================================================
   VOICES
   ============================================================ */
// KNOWN PLATFORM LIMITATION (2 Sep 2026) — "only one voice shows up per
// language in the dropdown, even though the phone's Settings > Text-to-
// speech screen lists two (e.g. Thai Voice I / Voice II)":
// This is Chrome-on-Android's own speechSynthesis.getVoices() behavior,
// not something populateVoiceSelect()/getVoiceCandidates() below is
// filtering out. Android's TTS Settings screen talks directly to the
// installed TTS engine and can show every voice variant it has; Chrome's
// Web Speech API, on the other hand, typically exposes just one merged
// SpeechSynthesisVoice object per language/locale from that engine,
// regardless of how many variants are installed underneath it. There is
// no documented way from page JS to ask Chrome for the engine's full
// variant list — populateVoiceSelect() already lists every voice
// getVoices() returns, so if only one Thai entry appears, that's the
// entire list the browser is giving us. Confirmed by outside reports of
// the same getVoices()-vs-Settings mismatch on Android Chrome (Chromium
// issue tracker, readium.org Web Speech API notes). If per-voice
// male/female choice for a language matters, the only reliable path is
// outside the browser's speechSynthesis API entirely (e.g. calling a
// separate installed app/engine via an Android-native wrapper, or a
// server-side TTS API), not a fix inside this HTML file.
// Some languages have one regional variant that's the far-more-common default
// for learners (e.g. US English, and US/Latin-American Spanish rather than
// Spain) — so within a language's matches, float those regions to the top
// and sink the less-expected default (Spain Spanish) to the bottom, rather
// than leaving order to whatever the OS happened to report voices in.
// Declared here, ahead of loadVoices()/its immediate call below, since that
// call can synchronously reach these through getVoiceCandidates.
// ------------------------------------------------------------------
// REGION PROFILES
// ------------------------------------------------------------------
// A "region profile" is keyed by an abstract profile key, which is NOT
// always the same thing as the BCP-47 prefix used to search for installed
// voices. That split matters in two situations this template has to
// handle:
//   1. More than one selectable language `code` shares a voice prefix but
//      needs a DIFFERENT default region — e.g. pt-BR and pt-PT both search
//      "pt" voices, fr-FR and fr-AFR both search "fr", and la-CI/la-VA/
//      la-HV all fall back to other languages entirely. A single
//      boost/primary table keyed by the 2-letter prefix can't tell these
//      apart, since selecting either one resolves to the same prefix.
//   2. A language with no dedicated voice falls back to a DIFFERENT
//      language whose own direct-selection default doesn't apply — e.g.
//      Lingala/Swahili fall back to English, but must default to Nigerian
//      English, not the US English that plain "English" defaults to.
//      Ranking by the matched prefix ("en") would wrongly reuse English's
//      own US-boost table for that fallback.
// So every selectable `code` maps (via CODE_TO_REGION_KEY below) to a
// profile, and profiles carry their OWN matchPrefixes (search order) and
// their OWN boost/primary/demote/preferredNames — never shared by prefix.
//
//   matchPrefixes    — BCP-47 prefixes to search for installed voices, in
//                       priority order. First prefix with any match wins;
//                       later entries are same-family-or-approximate
//                       fallbacks (e.g. Ecclesiastical Latin -> Italian).
//   boost/primary/demote — region tags (the part after the first '-' in
//                       the matched voice's lang, e.g. "US" in "en-US"),
//                       ranked within whichever prefix actually matched.
//   preferredNames   — exact on-screen voice names pinned to the top,
//                       above the region ranking (see preferExactNamesFirst
//                       below). Edit to match whatever names your Chrome
//                       dropdown actually shows — check the ✓-marked ones.
//   label            — human-readable name of the boosted region, for the
//                       "install a voice" nudge, per UI language.
//   alwaysApproximate — true when even a same-prefix match is never the
//                       "real" language (Latin, Lao-as-Thai, an African
//                       language with no dedicated voice), so the OS
//                       voice-install help should always show — not only
//                       when the fallback chain had to skip past the
//                       first prefix.
const AFRICAN_FR_REGIONS = ['CI','SN','CD','CM','ML','BF','NE','TG','BJ','GN','GA','CG'];
const AFRICAN_PT_REGIONS = ['AO','MZ','GW','CV','ST','TL'];
const ES_LATAM_REGIONS = ['US','MX','AR','CO','CL','PE','UY','VE','EC','GT','BO','PY','CR','PA','DO','HN','SV','NI','419'];

const REGION_PROFILES = {
  en: {
    matchPrefixes:['en'], boost:['US'], primary:'US',
    preferredNames:['English United States'],
    label:{ en:'United States', es:'Estados Unidos' },
  },
  es: {
    matchPrefixes:['es'], boost:ES_LATAM_REGIONS, primary:'US', demote:['ES'],
    preferredNames:['Spanish United States'],
    label:{ en:'United States or Latin America', es:'Estados Unidos o Latinoam\u00e9rica' },
  },
  de: {
    matchPrefixes:['de'], boost:['DE'], primary:'DE',
    label:{ en:'Germany', es:'Alemania' },
  },
  ru: {
    matchPrefixes:['ru'], boost:['RU'], primary:'RU',
    label:{ en:'Russia', es:'Rusia' },
  },
  'pt-BR': {
    matchPrefixes:['pt'], boost:['BR'], primary:'BR', demote:['PT'],
    label:{ en:'Brazil', es:'Brasil' },
  },
  'pt-PT': {
    matchPrefixes:['pt'], boost:['PT'], primary:'PT', demote:['BR'],
    label:{ en:'Portugal', es:'Portugal' },
  },
  // No browser realistically ships an Angola/Mozambique-accented Portuguese
  // voice — same situation as fr-AFR above — so this just searches "pt"
  // with African regions boosted (a no-op boost in practice) and BR/PT
  // demoted, rather than pretending a specific regional match exists.
  'pt-AFR': {
    matchPrefixes:['pt'], boost:AFRICAN_PT_REGIONS, demote:['BR','PT'],
    label:{ en:'a Sub-Saharan African Portuguese accent', es:'un acento portugu\u00e9s subsahariano' },
  },
  'fr-FR': {
    matchPrefixes:['fr'], boost:['FR'], primary:'FR', demote:AFRICAN_FR_REGIONS,
    label:{ en:'France', es:'Francia' },
  },
  'fr-AFR': {
    matchPrefixes:['fr'], boost:AFRICAN_FR_REGIONS, demote:['FR'],
    label:{ en:'a Sub-Saharan African French accent', es:'un acento franc\u00e9s subsahariano' },
  },
  // Ecclesiastical Latin -> Italian by default. Tries an actual "la" voice
  // first in case a browser ever ships one, but that's not expected.
  'la-ecc': {
    matchPrefixes:['la','it','es'], alwaysApproximate:true,
    label:{ en:'Italian (standing in for Ecclesiastical Latin)', es:'italiano (para el lat\u00edn eclesi\u00e1stico)' },
  },
  // Classical Latin and Hispania Vulgaris -> Spanish (US/Latin America) by
  // default. Reuses the same boost/primary/demote shape as the "es"
  // profile above, kept as its own entry since it's a different `code`
  // family with its own matchPrefixes/fallback order.
  'la-hisp': {
    matchPrefixes:['la','es','it'], alwaysApproximate:true,
    boost:ES_LATAM_REGIONS, primary:'US', demote:['ES'],
    preferredNames:['Spanish United States'],
    label:{ en:'United States or Latin America Spanish (standing in for this Latin register)', es:'espa\u00f1ol de Estados Unidos o Latinoam\u00e9rica (para este registro de lat\u00edn)' },
  },
  // Lao has no dedicated voice on most platforms -> Thai by default.
  //
  // KNOWN LIMITATION (2 Sep 2026): this fallback makes the Thai *engine*
  // speak, but the course text for a Lao line is still written in LAO
  // script. Thai and Lao are different Unicode blocks/scripts (they look
  // related but aren't the same characters), so the Thai voice can't
  // recognize Lao text as words at all — it falls back to sounding out
  // small character/syllable clusters one at a time, which is the
  // "staccato, stops at every syllable" behavior. This is NOT a bug in
  // this file's speak()/getVoiceCandidates() logic (u.lang is already
  // being set correctly to the chosen voice's own lang) — it's a script
  // mismatch between the text and the substitute engine, and it will
  // reproduce in ANY player built off this template until a real Lao
  // (lo/lo-LA) voice exists on the device. Options if this needs fixing:
  //   1. Check whether the device/browser has since added a real "lo"
  //      voice (matchPrefixes already tries 'lo' first — if one appears,
  //      it will be picked up automatically, no code change needed).
  //   2. Transliterate the Lao-script course text into Thai script before
  //      calling speak() for lo-th lines specifically (nontrivial — the
  //      scripts share ancestry but aren't a 1:1 character mapping).
  //   3. Leave the approximation as-is and rely on alwaysApproximate's
  //      "using a related language instead" note to set expectations.
  'lo-th': {
    matchPrefixes:['lo','th'], alwaysApproximate:true, boost:['TH'], primary:'TH',
    label:{ en:'Thai (standing in for Lao, which has no dedicated voice)', es:'tailand\u00e9s (para el lao)' },
  },
  // Any language with no dedicated voice and no better regional match
  // (currently Lingala, Swahili) -> Nigerian English by default. This is
  // its OWN profile — separate from the plain "en" profile above — so
  // that falling back to English here never inherits English's own US
  // default; the two are ranked independently even though both eventually
  // match "en" voices.
  'afr-en-ng': {
    matchPrefixes:['en'], alwaysApproximate:true, boost:['NG'], primary:'NG', demote:['US'],
    label:{ en:'Nigerian English (standing in for a language with no dedicated voice)', es:'ingl\u00e9s nigeriano' },
  },
  // Navajo has no dedicated voice on any platform -> US English by default.
  // Tries an actual "nv" voice first in case a browser ever ships one, but
  // that's not expected. Its own profile (not the plain "en" one above) so
  // this fallback is ranked independently of English's own defaults.
  'nv-en': {
    matchPrefixes:['nv','en'], alwaysApproximate:true, boost:['US'], primary:'US',
    label:{ en:'English (standing in for Navajo, which has no dedicated voice)', es:'ingl\u00e9s (para el navajo)' },
  },
  // Huasteca Nahuatl has no dedicated voice -> Mexican Spanish by default,
  // since it's spoken in the same Huasteca region of Mexico. Tries an
  // actual "nah" voice first in case one ever ships.
  'nah-es': {
    matchPrefixes:['nah','es'], alwaysApproximate:true, boost:['MX', ...ES_LATAM_REGIONS], primary:'MX',
    label:{ en:'Mexican Spanish (standing in for Huasteca Nahuatl, which has no dedicated voice)', es:'espa\u00f1ol mexicano (para el n\u00e1huatl huasteco)' },
  },
  // Southern Quechua has no dedicated voice -> Peruvian Spanish by default,
  // since it's spoken across the same Andean region of Peru/Bolivia. Tries
  // an actual "quz" voice first in case one ever ships.
  'quz-es': {
    matchPrefixes:['quz','es'], alwaysApproximate:true, boost:['PE', ...ES_LATAM_REGIONS], primary:'PE',
    label:{ en:'Peruvian Spanish (standing in for Southern Quechua, which has no dedicated voice)', es:'espa\u00f1ol peruano (para el quechua sure\u00f1o)' },
  },
  // Samoan has no dedicated voice on most platforms -> New Zealand English
  // by default (NZ is the largest Samoan-diaspora anglophone market, and
  // English is Samoa's other official language). Tries an actual "sm"
  // voice first in case one ever ships.
  'sm-en-nz': {
    matchPrefixes:['sm','en'], alwaysApproximate:true, boost:['NZ'], primary:'NZ',
    label:{ en:'New Zealand English (standing in for Samoan, which has no dedicated voice)', es:'ingl\u00e9s neozeland\u00e9s (para el samoano)' },
  },
  // Hawaiian has no dedicated voice on most platforms -> US English by
  // default (Hawaii is a US state and English is co-official there).
  // Tries an actual "haw" voice first in case one ever ships. Its own
  // profile (not the plain "en" one above) so it's ranked independently.
  'haw-en-us': {
    matchPrefixes:['haw','en'], alwaysApproximate:true, boost:['US'], primary:'US',
    label:{ en:'English (standing in for Hawaiian, which has no dedicated voice)', es:'ingl\u00e9s (para el hawaiano)' },
  },
  // Maori has no dedicated voice on most platforms -> New Zealand English
  // by default, for the same reason as the Samoan fallback above (NZ is
  // where Te Reo Maori is an official language). Tries an actual "mi"

  'mi-en-nz': {
    matchPrefixes:['mi','en'], alwaysApproximate:true, boost:['NZ'], primary:'NZ',
    label:{ en:'New Zealand English (standing in for M\u0101ori, which has no dedicated voice)', es:'ingl\u00e9s neozeland\u00e9s (para el maor\u00ed)' },
  },
  // Tongan has no dedicated voice on most platforms -> New Zealand English
  // by default, matching the Samoan fallback above (NZ has the largest
  // Tongan-diaspora anglophone population). Tries an actual "to" voice
