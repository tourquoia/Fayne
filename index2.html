<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Files</title>
<!-- 3-5-61: index2.html is NO LONGER a clone of index.html. It is a plain folder listing (like an FTP view) of the site's files, so pages that are not linked from index.html can still be opened. It asks GitHub's public API for the folder contents (github.io sites only; about 60 look-ups per hour per network, results are kept 10 minutes in this tab) and falls back to a server's own directory listing when there is one (e.g. python3 -m http.server). Override the repo with ?repo=owner/name. Hand-kept, not built. -->
<style>
:root{--bg:#FEF5E7;--ink:#3b2a1a;--soft:#8a6f55;--line:#E8D3B6;--card:#FFF4E2;--hi:#FDE6CC;--acc:#F05A22}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--ink:#f1e8dc;--soft:#a99a88;--line:#3a332c;--card:#1d1a17;--hi:#2b2520}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--acc);color:#fff;padding:14px 16px 12px}
header h1{margin:0;font-size:18px;font-weight:800}
#path{margin-top:4px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
#path a{color:#fff;text-decoration:underline;cursor:pointer}
main{max-width:680px;margin:0 auto;padding:12px 12px 40px}
.bar{display:flex;gap:8px;margin-bottom:10px}
#q{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
#only{padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
#only[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
li a{display:flex;gap:10px;align-items:center;padding:11px 12px;color:inherit;text-decoration:none;border-top:1px solid var(--line);cursor:pointer;font:14px ui-monospace,Menlo,Consolas,monospace}
li:first-child a{border-top:0}
li a:hover,li a:focus-visible{background:var(--hi);outline:none}
.ic{width:1.4em;text-align:center;flex:none}
.nm{flex:1;min-width:0;word-break:break-all}
.sz{color:var(--soft);font-size:12px;flex:none}
#msg{color:var(--soft);margin:12px 4px;font-size:14px}
#msg button{font:inherit;margin-left:6px}
</style>
<style>
/* BUILD BADGE (3-5-62): bottom-right, bold, same as the app pages (#appVersionBadge in the template). HAND-KEPT on this page: on EVERY zip build set the text of #appVersionBadge to the template version (template_arch_3-5-62 -> v3.5.62). Click-through, small, theme-aware. Do not remove. */
#appVersionBadge{ position:fixed; right:6px; bottom:4px; right:calc(6px + env(safe-area-inset-right, 0px)); bottom:calc(4px + env(safe-area-inset-bottom, 0px));
  z-index:40; font:700 14px/1 'Source Code Pro', ui-monospace, Menlo, monospace; color:#000; opacity:1; text-shadow:0 0 3px var(--bg-page, var(--bg, #fff));
  pointer-events:none; user-select:none; -webkit-user-select:none; }
@media (prefers-color-scheme: dark){ #appVersionBadge{ color:#F2EDE8; text-shadow:0 0 3px #000; } }
</style>
</head>
<body>
<header><h1>Files</h1><div id="path"></div></header>
<main>
  <div class="bar"><input id="q" type="search" placeholder="Filter by name…" aria-label="Filter by name" autocomplete="off"><button id="only" type="button" aria-pressed="true" title="Show only pages (.html) and folders">Pages only</button></div>
  <ul id="list" translate="no"></ul>
  <p id="msg">Loading…</p>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var host=location.hostname, segs=location.pathname.split('/').filter(Boolean), isGh=/\.github\.io$/i.test(host);
var qr=(location.search.match(/[?&]repo=([\w.-]+\/[\w.-]+)/)||[])[1];
var repo='', site='/', dir=segs.slice(0,-1);
if(isGh){var o=host.split('.')[0];
  if(segs.length>1||(segs.length===1&&!/\.html?$/i.test(segs[0]))){repo=o+'/'+segs[0];site='/'+segs[0]+'/';dir=segs.slice(1,-1);}
  else{repo=o+'/'+host;dir=[];}}
if(qr)repo=qr;
var all=[],cur=[],only=true,seq=0;
function curFromHash(){var h=decodeURIComponent(location.hash.replace(/^#\/?/,''));return h?h.split('/').filter(Boolean):(isGh?dir:[]);}
function sget(k){try{var v=JSON.parse(sessionStorage.getItem(k));if(v&&Date.now()-v.t<6e5)return v.d;}catch(e){}return null;}
function sset(k,d){try{sessionStorage.setItem(k,JSON.stringify({t:Date.now(),d:d}));}catch(e){}}
function fmt(n){return n==null?'':n<1024?n+' B':n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB';}
async function viaApi(p){
  var url='https://api.github.com/repos/'+repo+'/contents/'+p.map(encodeURIComponent).join('/'),c=sget(url);if(c)return c;
  var r=await fetch(url,{headers:{Accept:'application/vnd.github+json'}});
  if(r.status===403||r.status===429)throw new Error('limit');
  if(!r.ok)throw new Error('http '+r.status);
  var j=await r.json();if(!Array.isArray(j))throw new Error('not a folder');
  var d=j.map(function(x){return{n:x.name,d:x.type==='dir',s:x.type==='dir'?null:x.size};});sset(url,d);return d;}
async function viaListing(p){
  var r=await fetch(site+p.map(encodeURIComponent).join('/')+(p.length?'/':''));if(!r.ok)throw new Error('http '+r.status);
  var doc=new DOMParser().parseFromString(await r.text(),'text/html'),out=[],seen={};
  doc.querySelectorAll('a[href]').forEach(function(a){var h=a.getAttribute('href');
    if(!h||/^(\?|\/|#|\.\.|[a-z]+:)/i.test(h))return;var d=/\/$/.test(h),n=decodeURIComponent(h.replace(/\/$/,''));
    if(!n||seen[n])return;seen[n]=1;out.push({n:n,d:d,s:null});});
  if(!out.length)throw new Error('empty');return out;}
async function load(){
  var my=++seq;cur=curFromHash();crumbs();$('list').innerHTML='';$('msg').textContent='Loading…';
  var d=null,err='';
  try{d=isGh||qr?await viaApi(cur):await viaListing(cur);}catch(e){err=e.message;}
  if(!d&&(isGh||qr)){try{d=await viaListing(cur);}catch(e){}}
  if(my!==seq)return;
  if(!d){$('msg').innerHTML=(err==='limit'?'GitHub has paused file look-ups for this network for a while (about 60 per hour). Try again later.':'Could not read this folder'+(err?' ('+err+')':'')+'. It works on the github.io site; opened from a phone\u2019s files it cannot list anything.')+' <button type="button" id="retry">Retry</button>';$('retry').onclick=load;return;}
  all=d.filter(function(x){return x.n.charAt(0)!=='.';});draw();}
function crumbs(){
  var el=$('path'),root=isGh||qr?repo.split('/')[1]:location.host||'site';el.textContent='';
  var a=document.createElement('a');a.textContent='/'+root;a.href='#';a.onclick=function(e){e.preventDefault();location.hash='/';if(!location.hash)load();};el.appendChild(a);
  cur.forEach(function(s,i){el.appendChild(document.createTextNode('/'));var b=document.createElement('a');b.textContent=s;b.href='#/'+cur.slice(0,i+1).map(encodeURIComponent).join('/');el.appendChild(b);});}
function draw(){
  var f=$('q').value.trim().toLowerCase(),ul=$('list'),n=0;ul.innerHTML='';
  var rows=all.filter(function(x){return(!only||x.d||/\.html?$/i.test(x.n))&&(!f||x.n.toLowerCase().indexOf(f)>-1);});
  rows.sort(function(a,b){return a.d!==b.d?(a.d?-1:1):a.n.toLowerCase()<b.n.toLowerCase()?-1:1;});
  rows.forEach(function(x){var li=document.createElement('li'),a=document.createElement('a');
    a.href=x.d?'#/'+cur.concat(x.n).map(encodeURIComponent).join('/'):site+cur.concat(x.n).map(encodeURIComponent).join('/');
    a.innerHTML='<span class="ic">'+(x.d?'\uD83D\uDCC1':/\.html?$/i.test(x.n)?'\uD83D\uDCC4':'\u00B7')+'</span><span class="nm"></span><span class="sz"></span>';
    a.querySelector('.nm').textContent=x.n+(x.d?'/':'');a.querySelector('.sz').textContent=fmt(x.s);li.appendChild(a);ul.appendChild(li);n++;});
  $('msg').textContent=n?n+' item'+(n===1?'':'s')+(only&&all.length>n&&!f?' \u00B7 tap \u201CPages only\u201D to show every file':''):(all.length?'Nothing matches.':'This folder is empty.');}
$('q').addEventListener('input',draw);
$('only').addEventListener('click',function(){only=!only;this.setAttribute('aria-pressed',only);draw();});
window.addEventListener('hashchange',load);
load();
})();
</script>
<div id="appVersionBadge" aria-hidden="true" translate="no">v3.5.62</div>
</body>
</html>
