<style>
  :root{
    --blue:#3FA9FF;
    --blue-bright:#7FD4FF;
    --blue-dim:#1E4E78;
    --bg:#050810;
    --ink:#EAF2FB;
    --ink-soft:#9FB3C8;
    --ink-dim:#5C6E82;
    --card:rgba(8,14,26,0.4);
    --border:rgba(127,212,255,0.22);
    --gold:#F2C744;
    --gold-bright:#FFE28A;
    --gold-dim:#7A6320;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    overflow-x:hidden;
    position:relative;
    padding-left:44px;
  }

  /* ---- big glowing moon backdrop ---- */
  .moon-field{
    position:fixed; inset:0; z-index:0; overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%, #0A1830 0%, #050810 55%, #000103 100%);
  }
  .moon-img{
    position:absolute; top:-7%; left:calc(50% + 22px); transform:translateX(-50%);
    width:min(640px, 128vw); height:auto;
    filter: grayscale(1) brightness(1.05) sepia(1) hue-rotate(175deg) saturate(6.5) contrast(1.05);
    opacity:0.96;
  }
  .moon-glow{
    position:absolute; top:-10%; left:calc(50% + 22px); transform:translateX(-50%);
    width:min(750px, 146vw); aspect-ratio:1/1;
    background:radial-gradient(circle, rgba(63,169,255,0.55) 0%, rgba(63,169,255,0.22) 35%, rgba(63,169,255,0) 68%);
    filter:blur(6px);
    pointer-events:none;
  }

  /* ---- left-side chapter rail (numbers only) ---- */
  .chapter-rail{
    position:fixed; top:0; left:0; bottom:0; z-index:2;
    width:44px; overflow-y:auto;
    padding:22px 5px;
    display:flex; flex-direction:column; align-items:center; gap:9px;
    background:linear-gradient(90deg, rgba(5,8,16,0.88) 0%, rgba(5,8,16,0.6) 65%, rgba(5,8,16,0) 100%);
  }
  .chapter-rail-title{ display:none; }
  .chapter-tile{
    width:32px; height:32px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    text-align:center; background:rgba(10,18,32,0.55); border:1px solid rgba(242,199,68,0.35);
    border-radius:8px; font-family:'Inter', inherit;
    font-size:13px; font-weight:700; line-height:1; color:var(--gold); cursor:pointer;
  }
  .chapter-tile:hover{ color:var(--gold-bright); border-color:var(--gold); }
  .chapter-tile.active{
    color:#1a1300; background:linear-gradient(135deg, var(--gold), #C9971F);
    border-color:transparent; box-shadow:0 0 14px rgba(242,199,68,0.55);
  }
  .stars{ position:absolute; inset:0; opacity:0.5; background-repeat:repeat; }

  .content{ position:relative; z-index:1; width:100%; max-width:480px; padding:4px 18px 130px; display:flex; flex-direction:column; align-items:center; }

  h1.title{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:700;
    font-size:40px; margin:0 0 2px; text-align:center; color:var(--ink);
    text-shadow:0 0 18px rgba(127,212,255,0.55), 0 0 46px rgba(63,169,255,0.35);
    letter-spacing:.02em;
  }
  p.tagline{ font-size:12.5px; color:var(--ink-soft); text-align:center; margin:0 0 10px; letter-spacing:.04em; }
  .below-moon-gap{ width:100%; height:32vh; }

  .panel{
    width:100%; background:transparent; border:none; border-radius:16px;
    padding:0 18px 20px; box-shadow:none;
  }
  .field{ margin-bottom:14px; }
  .field:last-child{ margin-bottom:0; }
  label{
    display:block; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--blue-bright); margin-bottom:6px; font-weight:600;
  }
  select{
    width:100%; font-family:'Inter', inherit; font-size:13px; padding:9px 8px;
    border-radius:10px; border:1.5px solid var(--gold); background:#0A1220; color:var(--ink);
  }
  select:focus{ outline:2px solid var(--gold-dim); outline-offset:1px; }

  .rate-row{ display:flex; align-items:center; gap:10px; }
  .rate-row input[type=range]{ flex:1; accent-color:var(--blue); }
  .rate-row span{ font-size:12px; color:var(--ink-soft); width:38px; text-align:right; }

  .btn{
    width:100%; margin-top:18px; padding:14px; border-radius:12px; border:none;
    background:linear-gradient(135deg, var(--blue), #1E7FD9); color:#031320;
    font-weight:700; font-size:15px; letter-spacing:.02em; cursor:pointer;
    box-shadow:0 0 22px rgba(63,169,255,0.45);
  }
  .play-icon-btn{
    display:block; width:44px; height:44px; margin:0; padding:0; flex:0 0 auto;
    background:none; border:none; cursor:pointer;
    filter:drop-shadow(0 0 10px rgba(63,169,255,0.55));
  }
  .play-icon-btn svg{ width:100%; height:100%; display:block; }
  .play-icon-btn:hover{ filter:drop-shadow(0 0 14px rgba(63,169,255,0.75)); }
  .btn:hover{ filter:brightness(1.08); }
  .btn.ghost{
    background:transparent; border:1.5px solid var(--border); color:var(--ink-soft);
    box-shadow:none; font-weight:600;
  }
  .btn.small{ width:auto; padding:9px 10px; font-size:12.5px; margin:0; border:1.5px solid var(--gold); flex:0 0 auto; white-space:nowrap; }
  .file-row{ display:flex; align-items:center; gap:10px; }
  .controls-row{ display:flex; align-items:center; gap:8px; }
  .controls-row select{ flex:1 1 auto; min-width:0; }

  .hidden{ display:none !important; }

  /* ---- player screen ---- */
  .player{ width:100%; display:flex; flex-direction:column; align-items:center; }
  .chapter-tag{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--blue-bright);
    text-shadow:0 0 10px rgba(127,212,255,0.5); margin-bottom:10px;
  }
  .stage{
    width:100%; min-height:180px; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:10px 6px;
  }
  .line-text{
    font-family:'Cormorant Garamond', serif; font-weight:700; font-size:24px; line-height:1.45;
    color:var(--gold);
    -webkit-text-stroke:1.5px #000;
    paint-order:stroke fill;
    text-shadow:
      -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
      0 3px 8px rgba(0,0,0,0.6);
  }
  .progress-track{ width:100%; height:4px; border-radius:4px; background:rgba(127,212,255,0.15); overflow:hidden; margin-top:6px; }
  .progress-fill{ height:100%; background:linear-gradient(90deg, var(--blue-dim), var(--blue)); transition:width .25s; }
  .progress-cap{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-dim); margin-top:5px; }

  .transport{ display:flex; justify-content:center; gap:10px; margin-top:22px; }
  .icon-btn{
    width:46px; height:46px; border-radius:50%; border:1.5px solid var(--border);
    background:rgba(10,18,32,0.8); color:var(--ink-soft); font-size:16px; cursor:pointer;
  }
  .icon-btn.primary{ background:linear-gradient(135deg, var(--blue), #1E7FD9); border-color:transparent; color:#031320; box-shadow:0 0 18px rgba(63,169,255,0.5); }
  .icon-btn:hover{ color:var(--ink); }

  .back-link{ margin-top:26px; background:none; border:none; color:var(--ink-dim); font-size:12px; text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
  .back-link:hover{ color:var(--ink-soft); }
</style>
</head>

const CHAPTERS = {"1": ["I turned eighteen on a full moon, and I didn't think anything of it until much later.", "That's the strange thing about the beginning of a story — you're inside it before you know it's started.", "If you'd asked me that afternoon, I would have told you nothing was happening at all.", "Just a birthday.", "Just the ordinary ache of being a year older and no more certain of anything than I'd been the day before.", "I've always loved the moon.", "Not in the vague, everyone-likes-a-full-moon way — I mean I feel it, the way some people feel a change in weather before it arrives.", "I was driving home that evening with the windows cracked, and the moon was already up even though the sky wasn't fully dark yet, huge and low over the road, and I was talking myself through it out loud, the way I do when no one's in the car to think it's strange.", "\"I love the moon,\" I said, like I was explaining it to someone.", "\"That's why I go by Luna.\"", "I felt that pull again, driving home on my birthday of all nights, that low hum of something under my skin that I've never had a word for.", "Energy.", "Kinship, maybe.", "Like the moon and I were in on something together.", "Then I turned onto my street, and there was a dog sitting on my porch.", "White, gangly, too much puppy for his own paws yet.", "He didn't run, didn't bark, just sat there and watched me get out of the car like he'd been expecting me.", "No collar.", "I crouched down a few feet away and he came to me instead of the other way around, pressed his head into my hand like we already knew each other.", "\"Okay,\" I said.", "\"Let's get you to the vet.\"", "He had a chip.", "That was the good news.", "The bad news was the number on file rang and rang and never once picked up.", "I found the address that went with it and drove out there myself, because by then I think I already wanted a reason to keep him.", "No one lived there.", "The house was empty, for-sale sign leaning sideways in the yard, mail piled up behind a locked door.", "Whoever he belonged to was gone, and hadn't taken him with them.", "I sat in the car for a minute before I drove home.", "\"Buddy,\" I told him, even though he couldn't hear me from the back seat, \"you have a home.", "Come with me.\"", "I bought a bed he didn't end up using, a crate he definitely didn't use, a leash, bowls, a bag of puppy food I had to ask a stranger in the aisle to help me pick out.", "By the time we got back to the apartment it was late — later than I meant to be out on my own birthday — and we sat together on the floor of my room, him leaning his whole weight into my side like he'd done it a hundred times before.", "\"So,\" I said.", "\"What's your name, buddy?\"", "He looked up at me, and I mean really looked, the kind of look that makes you feel like something's being decided.", "I looked back.", "\"How about Bob?\"", "Nothing.", "Not even a blink.", "I laughed, and thought for a second, and then — I don't know where it came from, it just arrived, whole, like it had been sitting there waiting for me to ask the right question.", "\"Valerius.\"", "He barked.", "Once, sharp and certain, like he was agreeing to something.", "\"Okay,\" I said, something settling in my chest that I didn't have a name for yet.", "\"Okay.", "You're Valerius.\"", "I scratched behind his ears and he leaned in harder, and I said it again just to hear how it sounded out loud, the way you test a word to see if it's really yours.", "\"Alright, Valerius.", "I love you.\"", "He didn't understand the words.", "I don't think he needed to.", "He just stayed there, warm and solid against my side, like he'd already decided the same thing about me.", "My mom had left a cake on the counter, half-frosted, because she'd gotten a call from work in the middle of it and never came back to finish.", "I ate a piece standing up, in the dark, Valerius circling my ankles, because I hadn't bothered with the light.", "Through the kitchen window the moon was enormous — that low, swollen, almost embarrassed kind of full that makes you feel like it's looking back at you.", "I remember thinking it looked closer than usual.", "I didn't think anything else about it.", "I went to bed, Valerius following me up like he'd always slept there.", "He settled at the foot of my bed the way he'd settle every night after that, a small warm weight against my ankles.", "I fell asleep with my hand hanging off the mattress, not quite touching him, the way you do when you've had a dog for exactly one day and touching him on purpose already feels like something too big to name.", "I dreamed he grew.", "Not the way dreams usually go, disconnected and slippery, gone before you can hold the shape of them.", "This one I remember in full, in order, like it happened to my body and not just my head.", "I dreamed I woke up — inside the dream — because Valerius was breathing differently, slower, deeper, a sound too big for a dog his size to make.", "I dreamed I sat up and the moonlight coming through the window wasn't grey anymore, it was white, white like something poured, and it was pooling on the bed exactly where he lay.", "I dreamed I watched him change the way you'd watch water freeze if you could actually see it happening — not frame by frame, but not instant either, somewhere in between, his small body drawing itself out long and lean, his fur catching the light and holding it, until what was lying on my bed wasn't a dog anymore.", "It was a wolf.", "Snow white, enormous, taking up more of the bed than Valerius ever could have, and it lifted its head and looked at me with his same brown eyes, exactly his eyes, and I wasn't afraid.", "That's the part I keep coming back to.", "I wasn't afraid at all.", "I remember reaching out and resting my hand on its neck, and it was warm, and it huffed out a breath like it was as tired as I was, and I fell back asleep with my hand still there.", "In the morning, Valerius was curled at the foot of the bed, small and white and entirely a puppy, snoring softly, like the whole night had never happened.", "I lay there for a long time before I got up.", "I told myself it was just a birthday dream — the kind your brain hands you when it's trying to make a day feel like it mattered, and this one had already handed me a dog by dinnertime.", "Eighteen.", "A wolf instead of a puppy.", "Nothing subtle about it, symbolically.", "I got up, I got dressed, I ate cereal standing at the same counter where the half-frosted cake still sat, and I told myself that was that.", "I didn't know yet that it would happen again.", "I didn't know to count the days until the next full moon, or that when it came, I'd wake up already knowing, already feeling it in my chest like a held breath, hours before the moon even rose.", "I didn't know any of what I was, or what it would cost the people around me for me to find out.", "I just knew it was the first day of school, and I didn't know a single person in the building I was about to walk into, and some small, stupid, hopeful part of me still thought that was the biggest thing about that day.", "I was wrong about that too."], "2": ["I got up before my alarm, which never happens, and found Valerius already awake, watching the door like he expected someone to walk through it.", "\"It's just school,\" I told him, and he thumped his tail once against the mattress like he didn't believe me either.", "I'd moved enough times to know the first-day routine by heart — get there early, find the office, get the schedule, try to look like a person who has somewhere to be even when you don't.", "I ate standing up again, cereal this time instead of cake, and left Valerius stretched out in a patch of sun on the kitchen floor like he already owned the place.", "The hallway outside the office was where I saw her the first time.", "She was sitting on the floor with her back against the lockers, reading, feet pulled in so people could get past her, not making herself smaller so much as just not taking up more room than she needed.", "Dark hair, an old flannel over a school-issue shirt like she hadn't quite decided how much effort the day deserved.", "She didn't look up when I stopped near her — I think I'd stopped because there was nowhere else obvious to stand while I figured out where I was going.", "\"You're new,\" she said, not a question, still reading.", "\"That obvious?\"", "\"You're standing like you're waiting for someone to tell you where to go.\" She looked up then.", "Dark eyes, steady in a way that made me feel like she was actually looking, not just glancing to be polite.", "\"Office is that way.", "They'll make you carry a paper map like it's 1994.\"", "I laughed, more than the joke deserved, and she almost smiled — not quite, but close enough that I noticed.", "\"I'm Luna,\" I said.", "\"Lyra.\"", "Neither of us said anything else for a second, and it wasn't awkward, which was its own small surprise.", "Then the first bell went, and she stood, unhurried, and said, \"Good luck with the map,\" and walked off in the opposite direction, and I stood there a second longer than I needed to before I made myself move.", "I didn't see her again until lunch, and by then I already had a table.", "It happened fast, the way these things do when you're new and someone decides to want you around.", "A girl caught my eye in the hallway between second and third period — bright, easy laugh, the kind of person who makes eye contact like she already knows you're going to be friends — and said, \"You look like you need someone to sit with,\" like it was a diagnosis.", "That was Wren.", "By lunch I had a name for everyone at the table, or near enough, and a seat that felt like it had been saved for me even though I'd never been there before.", "They were funny, and fast, finishing each other's sentences in a way that made me feel like I'd been let into something.", "One of them did something with a spoon and a glass of water that made it ring a note that shouldn't have been possible, and everyone laughed like it was nothing, like things like that happened all the time, and I laughed too even though something in my chest went very still and very interested.", "\"You're one of us,\" Wren said, not quite joking, and put her arm around my shoulders like it was already decided.", "I looked across the courtyard once, out of habit more than anything, and saw Lyra sitting alone under the breezeway with the same book from that morning, and for a second I thought about getting up.", "I didn't.", "It was easier to stay where I was already wanted.", "Valerius was waiting by the door when I got home, tail going before I even had my key in the lock, and I sat down on the floor with him — already, after one night, like it was a habit we’d had for years — and told him about my day — the girl on the floor with the book, the girl with the arm around my shoulders, the sound a glass of water made that it had no business making.", "He tilted his head at that last part, ears up, like he understood exactly what I meant.", "\"Yeah,\" I said.", "\"I don't get it either.\"", "I didn't know yet that I'd chosen anything that day.", "It didn't feel like a choice — it felt like something that happened to me, the way weather happens to you.", "I just knew I had somewhere to sit at lunch tomorrow, and a name to say hello to in the hallway, and that felt, for one whole day, like enough."], "3": ["The next few weeks folded into a rhythm so easy it almost scared me — wake, feed Valerius, drive to school with the windows cracked out of habit even though the birthday-night moon was long gone, find the table at lunch already waiting.", "Three weeks in now, though I'd stopped consciously counting — the kind of number that only occurs to you sideways, doing math about something else entirely.", "Small things started happening around the group.", "Not dramatic — nothing you could point to and call magic, not out loud, not yet.", "A candle in Sadie's locker that wouldn't stay lit no matter how many times someone flicked a lighter under it, until it did, all at once, three inches of flame from nothing.", "Priya guessed the ending of a movie none of them had seen a trailer for, guessed it exactly, word for word, and laughed it off as a good ear for tropes.", "Wren found a twenty-dollar bill in a jacket pocket she swore she'd checked that morning, empty.", "They played it as delight.", "That was the thing I noticed most — nobody flinched.", "Every strange thing got folded into the group's running joke about themselves, how lucky they were, how the universe apparently liked them.", "I laughed along and felt the low hum under my skin get a little louder every time, though I couldn’t have said why one had anything to do with the other.", "I told Valerius about it that night, the way I told him everything now, sitting on my floor with my homework abandoned beside me.", "\"They keep doing things,\" I said.", "\"Little things.", "Like — good things happening to them, over and over, more than luck should allow.\" He watched me with his head tipped, ears forward, the way he always did when I talked like this, like he was actually following the thought and not just my voice.", "\"Why do you think that is,\" I said, mostly to myself.", "\"Why do some people change, the longer you know them?", "Get sharper, or meaner, or — I don't know.", "And other people just shine.", "The longer you're around them the more they just — shine.\"", "Valerius huffed and put his head in my lap, and I scratched behind his ears and let the question go, the way you let go of things that don’t have an answer yet.", "At school the next day, Wren caught my wrist on the way to third period, grinning.", "\"Tell me you felt that yesterday.", "The candle thing.\"", "\"I felt something,\" I admitted.", "\"See, that's what I love about you,\" Wren said, already walking backward toward her own class.", "\"You don't pretend not to notice.\"", "I watched her go and thought: I don’t know what I’m not pretending not to notice.", "But I liked being seen, even for something I didn’t understand, and that was enough to carry me through the rest of the day.", "I caught sight of Lyra twice — once in the library, book open but not being read, and once walking out to the parking lot alone, unhurried, the same steady economy of motion.", "Neither time did either of them cross the distance.", "I told myself there would be time.", "I still believed, then, that there was no cost to choosing one thing over another — that you could keep both doors open as long as you liked.", "I didn’t know yet how wrong that was.", "I only knew that the group felt good to be near, that good things kept happening around them, and that some quiet, unexamined part of me had already started keeping count."], "4": ["I felt it three days before I had a reason to.", "A restlessness under my sternum, a kind of held-breath feeling that made me cut through my homework without finishing it and stand at my window at odd hours for no reason I could name.", "Valerius felt it too, or matched it, pacing the apartment at night, worrying at the door like something was due to arrive.", "It was Wren, of all people, who put words to it, saying it like small talk between classes.", "\"It's almost full again.", "I always get weird energy around the full moon — you?\"", "\"I don’t know,\" I said, too fast, and Wren just laughed and said, \"You will,\" and moved on to something else, easy as anything, like it was nothing more than talking about the weather.", "That was the first time I understood, really understood, that this wasn’t only happening to me.", "The whole group felt it.", "The candle, the guessed movie ending, the twenty-dollar bill — Wren’s careless it’s almost full again told me more than weeks of watching had.", "Whatever this was, it belonged to more than just me and a dog who turned into a wolf once a month.", "And yet.", "When the night actually came, gold and enormous over the treeline, I sat on the fire escape with Valerius pressed warm against my side and felt something that didn’t match what Wren had described.", "Not weird energy, exactly.", "Not a mood.", "Something closer to recognition — like the moon wasn’t affecting me so much as checking in with me, the way you’d check in with someone you already knew.", "I dreamed him into the wolf again that night, the same white enormity, the same brown eyes looking back at me like nothing had changed, and this time I wasn’t surprised, only grateful, the way you’re grateful for a thing arriving exactly when it’s supposed to.", "In the morning I sat across from my own reflection in the bathroom mirror for longer than I meant to, turning something over that I didn’t have language for yet.", "Wren felt weird energy.", "I felt seen.", "Those weren’t the same thing, and the gap between them sat in my chest all day like a held coin.", "At lunch, Sadie was recounting — breathless, delighted — how she'd known, actually known, which of three doors her mom had put the surprise present behind, no clue, no guess, just known.", "The table erupted.", "I smiled along and said the right things and underneath it kept turning the coin over: I don’t just feel weird energy.", "I turn a dog into a wolf.", "That is not the same category of thing.", "I didn’t say it out loud.", "I didn’t have anyone to say it to yet — not Wren, who’d laugh it into a joke; not the group, who’d turn it into another delighted story; not even Valerius, who already knew and couldn’t tell me whether that made it better or worse.", "I only knew, walking home under a moon already thinning back toward ordinary, that whatever I was, I was it alone."], "5": ["The prank was supposed to be funny.", "That was the thing everyone kept saying afterward, like saying it enough times might make it true again.", "It started as most of the group's jokes did — quick, casual, barely a plan at all.", "A freshman named Theo had been trailing after Sadie for weeks, awkward and obvious about it, and Priya suggested, laughing, that they let him think he had a chance.", "Set up a note.", "A time and place.", "Let him show up and wait.", "\"It’s not mean,\" Wren said, when I hesitated.", "\"It's just funny.", "He'll get over it.\"", "I told myself that was true, mostly because I wanted it to be, and I said nothing when the note went into his locker in handwriting that wasn’t quite Sadie’s but was close enough.", "He waited by the gym at lunch for twenty minutes.", "Someone had a phone out the whole time, angled just right.", "When he finally understood, his face did something I couldn’t stop thinking about for the rest of the day — a kind of collapsing, quick and total, the look of someone realizing the ground had never actually been there.", "The group watched the video back at their table, laughing, and I laughed too, a half-beat behind everyone else, because that was easier than not laughing.", "\"He’s fine,\" Wren said, when I finally asked.", "\"It's not that deep.\"", "\"He looked pretty upset.\"", "Wren’s face did something small and sharp then, gone almost before I registered it — a flash of something that wasn’t Wren, not the Wren who’d pulled me in on day one with an easy laugh and an open seat.", "\"God, Luna, don't be weird about it.", "It's a joke.\"", "It was the first unkind thing Wren had ever said to me, and it landed harder than its size should have allowed.", "I said nothing else.", "I noticed, though, the way you notice a single crack in a window — small, and impossible to unsee once you have.", "That night I sat with Valerius longer than usual, not talking, just sitting, and he leaned into me the way he did when something was wrong that I hadn’t said out loud yet.", "\"They’re not bad people,\" I told him, finally.", "\"I don't think they're bad people.\"", "Valerius didn’t argue, but he didn’t exactly agree either — just watched me with that steady, unreadable attention, and I found myself wondering, for the first time, whether the group’s luck and the group’s edge were the same thing wearing two different faces.", "Whether it was possible to have one without eventually getting the other.", "I thought of the seed of a question I’d asked him weeks ago — why some people change, the longer you know them, and others shine — and felt it shift under me, less like an idle wondering now and more like the beginning of an answer I didn’t want."], "6": ["It got worse before I let myself admit it was getting worse.", "Theo stopped coming to the cafeteria.", "Word moved the way it always does in a school that size — not the details, just the shape of it, a joke that had gone around, a kid who didn't show up to lunch anymore.", "Nobody at my table brought it up again.", "It was as if the video had simply evaporated once it stopped being funny, leaving no residue anyone had to account for.", "Then it happened again, smaller but sharper — a girl named Dana, who used to sit at the edge of Wren's orbit sometimes, got cut out overnight, no explanation given, just a group chat she was quietly removed from and a table where there was suddenly, apparently, no room.", "I hadn’t even noticed Dana was gone until I saw her eating alone by the vending machines, staring at her phone with the specific stillness of someone trying very hard to look busy.", "\"What happened with Dana?\" I asked, careful, testing the water.", "\"She got weird,\" Sadie said, like that explained anything, and the table moved on before I could ask what weird meant.", "Six weeks in now, and somewhere in the middle of all that, the moon had gone full a third time without my quite noticing until it was already past — I'd been too busy watching Dana disappear from a group chat to count days in the sky.", "The dream came anyway, unbothered by how distracted I was, Valerius stretching long and white under the same pouring moonlight, the same patient brown eyes.", "I woke to it feeling less like an event now and more like something my body just did without me, which was its own kind of unsettling.", "What wasn't ordinary was what I found when I actually looked at him in the morning light: his collar, snapped clean through, lying on the floor by my bed instead of around his neck, and a rim of dried mud under two of his claws that hadn't been there the night before.", "I turned the collar over in my hands for a long time before I put it in a drawer instead of throwing it away, the way you keep evidence for a case you haven't decided to open yet.", "I didn't tell anyone.", "I wasn't sure yet there was anything to tell.", "I found myself outside at the end of the day, not really heading anywhere, and Lyra was there — sitting on the low wall by the parking lot, backpack open beside her, not reading for once, just watching people leave.", "\"You look like you're doing math you don't like the answer to,\" Lyra said, without turning her head.", "I almost laughed.", "\"Is it that obvious?\"", "\"You get a specific face.\" Lyra glanced at me, unhurried the way she always was.", "\"I've seen it before.", "Freshman year, watching kids in my old friend group do the same thing to somebody.", "You start doing the math on whether you're one bad day away from being the somebody.\"", "I sat down next to her, closer than I meant to, and didn’t correct her, because it was exactly right.", "\"They’re not — bad, exactly,\" I said.", "\"That's what I keep telling myself.\"", "\"Maybe not,\" Lyra said.", "\"But good people can still be doing a bad thing.", "Those aren't opposites, whatever everyone wants to believe.\" She said it without heat, like she'd already worked it out a long time ago and was just handing over the answer, no charge.", "We sat there a while, not talking, and it wasn’t awkward — I noticed that again, the way I had the first day, how being near Lyra never seemed to require filling the silence.", "When Lyra finally stood to leave, she paused.", "\"For what it's worth,\" she said, \"you're allowed to just stop going along with things.", "Nobody hands you permission for that.", "You just do it.\"", "She walked off before I could answer, and I sat on the wall a long time after, turning the sentence over, feeling it settle somewhere it was going to stay."], "7": ["The journal turned up by accident, the way important things sometimes do — I was digging through a box of my grandmother’s old things my mother had never gotten around to sorting, looking for nothing in particular, a photograph maybe, something to feel less alone with.", "It was small, leather-bound, the cover soft with age, and it fell open on its own to a page near the middle, like it had been opened to that exact place a hundred times before.", "The handwriting was slanted and sure, unmistakably older than anything else in the box.", "Some of us are drawn to the moon the way iron is drawn to a magnet, it read.", "Not chosen by it — pulled.", "And what we carry, we don't create so much as we magnify.", "What's already inside a person, we make larger.", "Kindness becomes generosity.", "Small cruelty becomes cruelty with teeth.", "We do not make people who they are.", "We only make them more so, the longer we let them stand close.", "I sat very still on my bedroom floor, the box forgotten beside me, and read it again.", "Distance yourself from what is already turning toward harm, my grandmother had written, in the same sure hand, and it will not get the chance to turn all the way.", "Stand close to what is already turning toward light, and let it.", "That is the only real choice we get to make — not what people are, but who we let ourselves be near.", "Further down the same page, in ink gone a shade lighter, like she'd come back to it another night, my grandmother had written more.", "A familiar is not separate from us, she'd written.", "He carries what we are and shows it back, plainer than we could ever see it in a mirror.", "Some of us can call that showing all the way out into the body itself — draw the shape of what's true in him up out of his skin, for an hour, for a night, and set it loose to move around in the world.", "It is not a costume, and it is not a trick.", "It is only ever what was already there, made visible for as long as the moon holds the door open.", "I read that paragraph four times, my heart doing something complicated in my chest.", "It didn't say wolf.", "It didn't have to.", "It was my own question, handed back to me in a stranger’s voice that wasn’t a stranger at all.", "Why do some people change, the longer you know them, and others shine.", "I’d asked Valerius that on an ordinary night weeks ago, half a joke, half something realer, and here it was, answered in ink older than I was, like my grandmother had been waiting on the other side of the question the whole time.", "I thought of the candle that wouldn’t light and then did, all at once.", "The guessed ending.", "The twenty-dollar bill.", "Theo's face at the gym doors.", "Dana at the vending machines.", "Wren's small sharp flash of something that wasn't Wren.", "It wasn’t the moon making them lucky, or my imagination making them cruel.", "It was me.", "I had been standing close to something already tilting one direction and pouring myself into the tilt without meaning to, the way water finds the lowest point in a room without being told to.", "I thought about Lyra then, unbidden — steady, unhurried, never once needing an audience or an edge.", "What would it look like, being amplified into more of that.", "I thought I might already know, a little, from the way it felt sitting on that wall in the parking lot, saying nothing and it being enough.", "If what I carried made people more of what they already were, then closeness was never neutral — it was a kind of choosing, whether I meant it or not.", "And some part of me, quiet and certain, had already chosen who I wanted to make more of: not because she was easy, or safe the way empty things are safe, but because she was, plainly, unhesitatingly, full of something good, and I could not imagine standing near that and making it anything other than more itself.", "Valerius put his chin on my knee, patient, the way he’d been patient about all of it since the beginning, since before I understood there was anything to be patient with.", "\"Okay,\" I told him, quiet, the box still open beside me, the journal still open in my lap.", "\"Okay.", "I think I finally understand what I am.\"", "That night was, though I hadn't planned it, the fourth full moon since my birthday, and for the first time I didn't fall asleep before it started.", "I lay still with my eyes half open, watching moonlight pool white across the floor exactly the way my grandmother's ink had described it happening to people like me, and watched Valerius go long and pale and enormous a few feet away, and this time I understood, at least a little, what I was watching: not a dream doing something to him, but something true in him, called all the way out into the open air by something true in me.", "I didn’t feel afraid, saying it.", "I felt, for the first time in weeks, like I’d stopped falling and found the floor."], "8": ["I didn’t announce it.", "That was the first thing I decided, sitting with the journal the night before — there would be no scene, no speech, nothing anyone could point to and say that’s when Luna turned on us.", "Just a slow closing of a door I’d once walked through so easily I hadn’t noticed the hinge.", "It started small.", "I stopped saving a seat back at their table when I got there first.", "I let myself leave the group chat’s rapid-fire jokes unanswered a beat longer than I used to, then two beats, then long enough that the silence stopped needing an excuse.", "When Wren asked if I wanted to come to a party that Friday, I said I had plans — vague, unspecific, true only in the sense that staying home with Valerius counted as a plan now.", "\"You've been weird,\" Wren said, on the Tuesday of the second week, not unkindly, more puzzled than anything.", "\"Everything okay?\"", "\"Yeah,\" I said.", "\"Just tired.", "Senior year stuff.\" It wasn't a lie so much as a smaller truth standing in front of a bigger one.", "The fifth full moon came and went in the middle of all that quiet unraveling, almost an afterthought — a short, plain dream, Valerius pale and huge for an hour and then just Valerius again, no torn collar this time, no mud, nothing that needed explaining.", "I was almost disappointed by how ordinary it felt.", "I was starting, I realized, to want it to mean something new every time, instead of only confirming what I already knew.", "It cost more than I expected.", "Not the group’s approval — I found I missed that surprisingly little, once I stopped chasing it — but the specific, physical ease of being wanted somewhere without having to work for it.", "I missed the easy laugh in the hallway that used to catch my eye and pull me along before I’d decided anything.", "I missed, if I was honest, the version of myself who hadn’t yet understood what my closeness cost other people.", "I caught Sadie looking at me once across the cafeteria with something like hurt, quickly covered, and had to look away first.", "At home, I told Valerius about it the way I told him everything, sitting on the floor with my homework abandoned again, a pattern by now.", "\"I keep waiting for it to feel like the right thing,\" I said.", "\"Instead it just feels like a thing I'm doing.\"", "He put his head in my lap, and I scratched behind his ears, and after a while I added, quieter: \"Maybe that’s what the right thing feels like, sometimes.", "Not good.", "Just clear.\"", "I thought about my grandmother’s handwriting — distance yourself from what is already turning toward harm — and understood, with a small ache I hadn’t expected, that the sentence hadn’t been written about strangers.", "It had been written for exactly this: choosing to step back from , in pieces that came out sideways, never as a story, always as a fact dropped in because it was relevant to something else.", "I gathered enough to understand that Lyra had done, once, what I was doing now — stepped back from people who’d started turning sharp — and had spent a long time alone afterward before deciding alone suited her better than the alternative had.", "\"Does it still,\" I asked once, careful, \"suit you?", "Being alone?\"", "Lyra considered the question with the same unhurried attention she gave everything.", "\"It used to be the whole plan,\" she said.", "\"Lately I’ve been revising it.\" She didn’t elaborate, and I didn’t push, but something in my chest did the thing it had been doing since the hallway on day one — that low, private hum, except now it didn’t feel like static.", "It felt like recognition.", "We started walking to the parking lot together after last bell, no reason given, no reason needed.", "One Thursday, Lyra’s hand brushed mine reaching for the same library door, and neither of us moved away first, and neither of us said anything about it, and it stayed with me the entire drive home, warm and unresolved and entirely welcome.", "Valerius met me at the door that evening, tail already going, and I sat down on the floor with him and didn’t tell him anything at all, just sat, smiling at nothing in particular, in a way that felt new enough to notice.", "Then, on the sixth full moon since my birthday, something happened that didn't fit neatly into the pattern anymore.", "I let Valerius out into the yard that night the way I did most nights, ordinary as anything, a last trip before bed — except in the middle of it I was aware, in the loose, dreamlike way I always was, that the shape moving across the grass wasn't a dog anymore, it was the wolf, snow white and enormous under a moon that lit the whole yard silver.", "It felt, in the moment, like just another version of the same routine — a wolf letting himself out instead of a puppy, nothing stranger than that, the way a dream folds the impossible into the mundane without asking you to notice.", "Then he went rigid at the fence line, every muscle locked, staring at something in the dark past the yard that I couldn't see and never did see — and he took off after it, three strides, four, fast enough that my stomach dropped even half-asleep as I was, and then there was nothing.", "No shape.", "No sound.", "Whatever it had been, it was already gone, and I never found out if it had been a rabbit, or nothing at all, or something else entirely.", "He came back to the porch a few minutes later, panting, ordinary-sized again by the time I got the door open, and I told myself, the way I always did, that it had only been a dream.", "In the morning, heading out to catch the bus, I found the print in the mud by the fence — deep, clear, four toes and a pad, easily twice the size of anything Valerius's paws could have made.", "I stood over it a long moment, backpack still on one shoulder, and felt the last of the it-was-only-a-dream explanation give out from under me like a step that wasn't where I thought it was.", "I told Lyra that day, in the library, the words arriving before I'd fully decided to say them.", "\"I think my dog turns into a wolf,\" I said, \"on the full moon. I know how that sounds.\"", "Lyra didn't laugh, and didn't look at me like I'd said something that needed managing.", "\"Okay,\" she said, unhurried, the way she said everything.", "\"Tell me.\"", "So I told her — the birthday night, the dream that first time, the ones since, the collar, the mud, the print by the fence that morning, everything except the journal, except the word amplification, except what any of it might mean about me instead of just about him.", "\"I don't know if it's real,\" I said.", "\"I don't know if I'm dreaming him, or if something in me is pulling it out of him and I just happen to be asleep when it happens.\"", "Lyra was quiet for a while, turning it over the way she turned everything over.", "\"Either way,\" she said finally, \"he picked your porch.\"", "It wasn't an answer.", "It was better than one."], "10": ["I hadn’t meant to watch them.", "That was true, mostly — I’d been cutting across the courtyard to the library, the long way, and the table was just there, the way it always had been, and my eyes went to it out of five months of habit before I could stop them.", "They looked ordinary.", "That was the first thing I registered, and it took me a second lap of the thought to understand why it startled me.", "Wren was laughing at something Priya said, easy and unremarkable, the kind of laugh that didn't have an edge hiding under it.", "Sadie was doing homework, actual homework, brow furrowed over an equation instead of over someone's downfall.", "There was no candle trick, no guessed ending, no careless cruelty performed for an audience.", "Just three girls at a lunch table, being nothing more than exactly that.", "The seventh full moon had come and gone three nights before, unremarkable — Valerius pale and huge for his usual hour, no mud this time, no surprises, just the wolf and then just the dog again, like the strangeness itself was learning to behave.", "I'd started, without quite deciding to, watching the group and watching the sky on roughly the same calendar, as if one might eventually explain the other.", "I stood at the edge of the courtyard longer than I meant to, feeling something complicated settle over me — relief, mostly, that they seemed genuinely fine, genuinely themselves, whatever selves that turned out to mean without me standing close enough to pull anything sharper out of them.", "My grandmother’s ink came back to me: we do not make people who they are.", "We only make them more so.", "Wren, apparently, without me amplifying anything, was just a girl who laughed easily and occasionally said something she’d regret, same as anyone.", "Ordinary-sized.", "Human-sized.", "It should have felt like enough, that proof.", "In a way it did — a quiet, private confirmation that I hadn’t imagined any of it, that the journal hadn’t been a comforting story I’d built to explain away a strange few months.", "I had been real.", "What had happened around that table had been real, and it had stopped being real the moment I’d stopped standing close enough to cause it.", "But there was a loneliness folded inside the relief that I hadn’t expected.", "Because none of them knew.", "Wren would never know that the sharp flash of temper that day at the gym doors, the casual cruelty toward Theo, the quick cutting of Dana from the group chat — none of it would ever be traced back to me, the girl who used to sit at their table and laugh a half-beat behind everyone else.", "They'd simply gone back to normal, the way weather clears, with no memory of having been anything other than themselves.", "There was no one I could explain this to.", "No one who would ever fully believe the shape of what I’d carried those months, let alone forgive me for not understanding it sooner.", "I thought, watching them from the edge of the courtyard, that this might be the truest cost of what I was — not the things I caused, exactly, but the fact that I’d always have to carry the knowledge of them alone, unwitnessed, unconfirmed by anyone who’d lived through it from the other side.", "I turned before any of them noticed me standing there, and went to find Lyra instead, because at least that was a kind of company that didn’t require me to explain anything I wasn’t ready to."], "11": ["There was no final conversation with Wren's table, no scene, no goodbye that either side marked as a goodbye.", "I simply became a person who ate lunch in the library most days and sat with Lyra after school and drove home to a dog who understood more than a dog should, and the version of me that had once needed a table to belong to faded the way a photograph fades — not erased, just quietly less vivid than it used to be.", "I still thought about them sometimes.", "Wren’s laugh, easy and bright before I had ever complicated it.", "The candle.", "The twenty-dollar bill.", "I let myself think of those months as something that had genuinely happened, not a mistake to disown, because disowning it would have meant disowning the parts of myself I’d needed those months to find — the question I’d asked Valerius on an ordinary night, my grandmother’s journal that had answered it, the understanding of what I was and what I owed to the people I let myself stand close to.", "On a Thursday in late fall, Lyra came over for the first time — no occasion, just a study session that both of us knew, the moment it was proposed, wasn’t really about studying.", "It was two nights past the eighth full moon since my birthday, close enough that Valerius still slept like he was recovering from something, though nothing had happened this time worth mentioning — just the wolf, the yard, and back again before dawn, ordinary as breathing now.", "Valerius met her at the door like he’d been expecting her for weeks, tail going, pressing his head against her hand exactly the way he had with me the very first night.", "\"He likes you,\" I said, surprised by how much that mattered to me.", "\"Smart dog,\" Lyra said, crouching down to let him lean his whole weight into her side.", "Later, homework abandoned on the floor between us, I told her the rest of it — the amplification, my grandmother’s ink-slanted handwriting, Theo’s face at the gym doors, Dana at the vending machines, the courtyard and the lunch table gone ordinary without me, and how it all traced back to the same wolf she already knew about.", "I told it all in order, the way the wolf dream itself had come to me that first night, not disconnected and slippery but whole, remembered in full.", "\"I still don't know,\" I told her, \"if I dream him into it, or if I'm only pulling out something that was already true and just happened to be asleep for it.", "I've never known.", "I don't think I ever will.\"", "Lyra listened without flinching, without the careful, managed expression people wore when they were deciding how to react.", "When I finished, she was quiet for a long moment, turning it over the way she turned everything over.", "\"That explains a few things,\" Lyra said finally.", "\"About you standing in that hallway on the first day, looking like you were about to either run toward something or away from it.", "I couldn't tell which.\"", "\"Which do you think it was?\"", "\"Doesn’t matter now,\" Lyra said, and reached over, and took my hand, unhurried, the way she did everything, like there was no reason on earth to rush a thing that was already true.", "\"You ended up here either way.\"", "\"And the wolf?\" I asked.", "\"Do you think it's real?\"", "Lyra shrugged, unbothered by not knowing.", "\"Maybe we never find out for sure,\" she said.", "\"Maybe that's just part of what he is.", "Us not fully knowing doesn't make it less true.\"", "I found, strangely, that I could live inside that answer.", "It felt more honest than certainty would have.", "Valerius settled between us with a heavy, contented sigh, and outside the window the moon hung past full now, already thinning back toward ordinary, doing what moons do — and for the first time since my birthday months ago, I didn’t feel the low hum of something waiting to happen.", "I felt, instead, like whatever had been waiting had already arrived, and settled, and was simply mine to keep.", "I’d stopped performing a version of myself built to be easy to want.", "What I had now — Valerius asleep against my leg, Lyra’s hand still loosely in mine, my grandmother’s journal on the shelf behind me holding the truest thing anyone had ever told me about who I was — I had chosen.", "Every piece of it.", "That, I understood now, had been the actual milestone all along, the one no single chapter could hold by itself: not becoming something, but choosing, finally, exactly who to become it around.", "I hadn't just chosen someone to keep close.", "I'd chosen someone whose goodness I could only ever make larger, never smaller, no matter how near I stood — and out of everything I now understood about what I was, that felt like the safest, truest use I could put it to."]};
const TITLES = {"1": "Chapter One", "2": "Chapter Two", "3": "Chapter Three", "4": "Chapter Four", "5": "Chapter Five", "6": "Chapter Six", "7": "Chapter Seven", "8": "Chapter Eight", "9": "Chapter Nine", "10": "Chapter Ten", "11": "Chapter Eleven"};
const CH_KEYS = Object.keys(CHAPTERS).sort((a,b)=>parseInt(a)-parseInt(b));

const S = { voiceURI:'', rate:0.95, chapter:CH_KEYS[0], lines:[], idx:0, token:0, playing:false, warmedVoiceKeys:new Set() };

/* ---- setup: chapter rail ---- */
const chapterRail = document.getElementById('chapterRail');
function renderChapterRail(){
  chapterRail.querySelectorAll('.chapter-tile').forEach(t=>t.remove());
  CH_KEYS.forEach(k=>{
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'chapter-tile' + (k===S.chapter ? ' active' : '');
    tile.title = TITLES[k] || ('Chapter '+k);
    tile.textContent = k;
    tile.addEventListener('click', ()=>{
      if(S.chapter===k) return;
      S.chapter = k;
      renderChapterRail();
    });
    chapterRail.appendChild(tile);
  });
}
renderChapterRail();

/* ---- setup: voices ---- */
let voices = [];
let userPickedVoice = false;
let voicesSettled = false;
function loadVoices(finalize){
  voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const sel = document.getElementById('voiceSelect');
  const prev = sel.value;
  sel.innerHTML = '';

  // All browser voices (network or local) go in one green tier — on this device,
  // local vs. network isn't a reliable quality signal, so Preview is the real tool
  // for telling them apart, not the tier color.
  const sorted = [...voices].sort((a,b)=>{
    const rank = v => {
      const lang = (v.lang||'').toLowerCase();
      if(lang === 'en-us') return 0;
      if(lang.startsWith('en')) return 1;
      return 2;
    };
    const ra = rank(a), rb = rank(b);
    if(ra !== rb) return ra - rb;
    return a.name.localeCompare(b.name);
  });
  const browserGroup = document.createElement('optgroup');
  browserGroup.label = '🟢 Browser voices (use Preview to compare)';
  sorted.forEach(v=>{
    const o = document.createElement('option');
    o.value = v.voiceURI;
    const isTargetLang = v.lang && v.lang.toLowerCase().startsWith('en');
    const check = isTargetLang ? '✓ ' : '';
    o.textContent = '🟢 ' + check + v.name + ' (' + v.lang + ')';
    browserGroup.appendChild(o);
  });
  if(browserGroup.children.length) sel.appendChild(browserGroup);

  if(userPickedVoice && prev && [...sel.options].some(o=>o.value===prev)){
    // The user already made an explicit choice — keep it no matter what stage loading is at.
    sel.value = prev;
    S.voiceURI = sel.value;
  } else if(finalize){
    // Only lock in a default once the voice list is done loading, so we never get stuck
    // on whatever happened to be loaded first (e.g. a low-quality regional English voice).
    // Match en-US loosely (some platforms report "en_US", "EN-US", etc. instead of "en-US"),
    // and also catch voices whose lang tag is vague but whose name says US English.
    const normLang = v => (v.lang||'').toLowerCase().replace('_','-');
    const looksUS = v => /\bunited states\b|\bus english\b|\(us\)/i.test(v.name||'');
    const anyEnglish = sorted.find(v=>(v.lang||'').toLowerCase().startsWith('en'));
    const enUS = sorted.find(v=>normLang(v)==='en-us') || sorted.find(looksUS) || anyEnglish;
    if(enUS){
      sel.value = enUS.voiceURI;
    } else if(browserGroup.children.length){
      // No English voice at all on this device/browser — fall back to
      // whatever is available rather than leaving the select empty.
      sel.value = browserGroup.children[0].value;
    }
    S.voiceURI = sel.value;
  }
  // While still loading and not yet finalized, we leave S.voiceURI untouched (whatever
  // it already was) so nothing gets spoken with a not-yet-final voice pick.
}
if(window.speechSynthesis){
  loadVoices(false);
  speechSynthesis.onvoiceschanged = ()=> loadVoices(voicesSettled);
  // onvoiceschanged doesn't fire reliably in every context (especially local files),
  // and the list can come back empty or partial on first load. Poll until the voice
  // count stops changing between checks (i.e. the list has actually finished loading),
  // then finalize the default. Fall back to finalizing anyway after ~5s so we never
  // wait forever if the browser never reports a stable list.
  let voiceCheckAttempts = 0;
  let lastCount = voices.length;
  const voiceCheckInterval = setInterval(()=>{
    voiceCheckAttempts++;
    const found = speechSynthesis.getVoices();
    if(found.length !== lastCount){
      lastCount = found.length;
      loadVoices(false);
      return;
    }
    if(!voicesSettled && (found.length > 0 || voiceCheckAttempts >= 20)){
      voicesSettled = true;
      clearInterval(voiceCheckInterval);
      loadVoices(true);
    }
  }, 250);
} else {
  loadVoices(true); // no speechSynthesis on this browser at all — render the (empty) select anyway
}
document.getElementById('voiceSelect').addEventListener('change', e=>{ userPickedVoice = true; S.voiceURI = e.target.value; });
document.getElementById('rateSlider').addEventListener('input', e=>{
  S.rate = parseFloat(e.target.value);
  document.getElementById('rateVal').textContent = S.rate.toFixed(2)+'×';
});
document.getElementById('previewBtn').addEventListener('click', ()=>{
  stopAllAudio();
  S.token++;
  const myToken = S.token;
  document.getElementById('previewBtn').disabled = true;
  speak('The moon was already up, huge and low over the road.', myToken)
    .finally(()=>{ document.getElementById('previewBtn').disabled = false; });
});

function stopAllAudio(){
  if(window.speechSynthesis) speechSynthesis.cancel();
}

/* ---- speech ---- */
function pickVoice(uri){ return voices.find(v=>v.voiceURI===uri) || null; }
// IN-APP-BROWSER DETECTION (2026-09): flags embedded WebViews (Messenger's
// built-in browser, Instagram's, generic Android WebView, and similar) that
// commonly lack the full system TTS bridge real Chrome has. UA-sniffing is
// inherently a best-effort heuristic -- it can't catch every embedded
// browser and shouldn't be trusted for anything except "should we show a
// friendly heads-up," which is all it's used for here.
function detectRestrictedWebview(){
  const ua = navigator.userAgent || '';
  // FBAN/FBAV/FB_IAB: Facebook/Messenger's in-app browser. Instagram: its
  // own in-app browser. Line/MicroMessenger: other common in-app browsers.
  // "; wv)" is the token Android's WebView itself adds to its UA string
  // when a native app embeds a generic (non-Chrome) WebView.
  if(/FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|; ?wv\)/i.test(ua)) return true;
  if(!window.speechSynthesis) return true;
  return false;
}
document.addEventListener('DOMContentLoaded', ()=>{
  const notice = document.getElementById('webviewNotice');
  if(notice && detectRestrictedWebview()) notice.classList.remove('hidden');
  const dismiss = document.getElementById('webviewNoticeDismiss');
  if(dismiss) dismiss.addEventListener('click', ()=>{ notice.classList.add('hidden'); });
});

function speak(text, token){
  if(!text) return Promise.resolve();
  return speakBrowser(text, token);
}
// Shared duration estimate used both to size the watchdog window and to
// judge whether an utterance that ended suspiciously fast was truncated.
function estimateMs(text){
  const words = (text||'').trim().split(/\s+/).filter(Boolean).length || 1;
  const secs = words / (2.3 * (S.rate||1));
  return Math.max(500, Math.min(4200, secs*1000));
}
function speakBrowser(text, token, retryCount){
  retryCount = retryCount || 0;
  return new Promise(resolve=>{
    if(!text || !window.speechSynthesis){ resolve(); return; }
    // PORTED FROM SHARED PLAYER TEMPLATE (2026-09), v3-v5 anti-clipping fix:
    // some engines occasionally start an utterance corrupted -- the front
    // (sometimes the whole short line) gets eaten even though the callback
    // chain looks normal. Two layers fix this:
    //   1. PRIMING: the first time a given voice is used this session, warm
    //      it up with a silent (volume 0) throwaway utterance first. Some
    //      engines need real warm-up time that speaking/pending never
    //      exposes to JS.
    //   2. DETECT-AND-RETRY: after each utterance, check its first
    //      word-boundary event and/or total speaking duration for signs the
    //      front got cut off; if so, automatically re-speak that exact line
    //      once before moving on.
    const voiceKey = S.voiceURI || '';
    const needsPriming = !S.warmedVoiceKeys.has(voiceKey);
    function afterIdle(cb){
      let waited = 0;
      const poll = setInterval(()=>{
        waited += 40;
        if(token!==S.token){ clearInterval(poll); resolve(); return; }
        if(!speechSynthesis.speaking && !speechSynthesis.pending){
          clearInterval(poll);
          cb();
          return;
        }
        if(waited >= 1200){
          clearInterval(poll);
          speechSynthesis.cancel();
          setTimeout(cb, 350);
        }
      }, 40);
    }
    function primeVoice(cb){
      const p = new SpeechSynthesisUtterance('a');
      p.volume = 0;
      p.rate = S.rate;
      const v = pickVoice(S.voiceURI);
      if(v){ p.voice = v; p.lang = v.lang; }
      let primed = false;
      const done = ()=>{ if(primed) return; primed = true; cb(); };
      p.onstart = done;
      p.onend = done;
      p.onerror = done;
      speechSynthesis.speak(p);
      // Safety valve: some engines never fire onstart/onend for a silent
      // utterance at all. Don't wait forever -- move on after a generous
      // fixed window either way.
      setTimeout(done, 900);
    }
    afterIdle(()=>{
      if(token!==S.token){ resolve(); return; }
      if(needsPriming){
        primeVoice(()=>{
          S.warmedVoiceKeys.add(voiceKey);
          if(token!==S.token){ resolve(); return; }
          setTimeout(()=>{
            if(token!==S.token){ resolve(); return; }
            startUtterance();
          }, 350);
        });
      } else {
        setTimeout(()=>{
          if(token!==S.token){ resolve(); return; }
          startUtterance();
        }, 350);
      }
    });
    function startUtterance(){
    let done = false, check, hardCeiling, started = false, missCount = 0;
    let startedAt = 0, firstBoundaryIdx = null;
    const wordCount = (text||'').trim().split(/\s+/).filter(Boolean).length;
    const finish = ()=>{
      if(done) return;
      done = true;
      clearInterval(check);
      clearTimeout(hardCeiling);
      resolve();
    };
    const retryThisLine = (reason)=>{
      if(done) return;
      done = true;
      clearInterval(check);
      clearTimeout(hardCeiling);
      console.warn('[speech] suspected truncated playback, retrying line', {text, reason});
      setTimeout(()=>{
        if(token!==S.token){ resolve(); return; }
        speakBrowser(text, token, retryCount+1).then(resolve);
      }, 300);
    };
    const finishOrRetry = ()=>{
      if(done) return;
      // Only ever retry once per line, and only for lines with enough words
      // that "most of it got skipped" is even a meaningful idea -- a
      // genuinely one-word line has no "front" to lose.
      if(retryCount < 1 && wordCount >= 2){
        if(firstBoundaryIdx !== null && firstBoundaryIdx > 3){
          retryThisLine('first boundary at charIndex '+firstBoundaryIdx);
          return;
        }
        const elapsed = startedAt ? Date.now()-startedAt : 0;
        const expected = estimateMs(text);
        if(started && elapsed>0 && elapsed < expected*0.45){
          retryThisLine('elapsed '+elapsed+'ms vs expected '+Math.round(expected)+'ms');
          return;
        }
      }
      finish();
    };
    const u = new SpeechSynthesisUtterance(text);
    u.rate = S.rate;
    const v = pickVoice(S.voiceURI);
    if(v){ u.voice = v; u.lang = v.lang; }
    u.onstart = ()=>{ started = true; startedAt = Date.now(); };
    u.onboundary = (e)=>{ if(firstBoundaryIdx===null) firstBoundaryIdx = e.charIndex; };
    u.onend = finishOrRetry;
    u.onerror = finish;
    speechSynthesis.speak(u);
    // See "WATCHDOG BUGFIX v2" below for why these are computed instead of
    // using fixed 120ms/240ms: poll faster at higher rates so a short
    // utterance still gets several ticks, and size the confirmation window
    // as a fraction of this line's own estimated duration (floored/capped)
    // so it can't outlast the line itself.
    const pollMs = Math.min(120, Math.max(40, 120 / (S.rate||1)));
    const missWindowMs = Math.min(240, Math.max(80, estimateMs(text) * 0.25));
    const missesNeeded = Math.max(1, Math.round(missWindowMs / pollMs));
    check = setInterval(()=>{
      if(token!==S.token){
        // BUGFIX (2026-09): don't cancel() here. Every caller that bumps
        // S.token (prevLessonBtn/nextLessonBtn, prevBtn/nextBtn, repeatBtn,
        // pause) already calls speechSynthesis.cancel() itself, synchronously,
        // BEFORE bumping the token and starting the next line. This interval
        // belongs to the OLD utterance and only ticks every 120ms, so by the
        // time it notices the token changed, the engine may already be a
        // few ms into speaking the NEW utterance under the new token. Calling
        // cancel() again here is a stale double-cancel that can silently wipe
        // out that brand-new utterance instead of the one this poll was
        // actually tracking. Just stop polling and resolve; don't touch the
        // engine.
        finish();
        return;
      }
      // WATCHDOG BUGFIX v2 (2026-09): a fixed 240ms confirmation window
      // doesn't scale -- a short line played at 2x speed can finish
      // speaking in well under 240ms, so the window ends up bigger than the
      // whole utterance and a normal end-of-speech blip in `speaking` reads
      // as truncation. Fix: size the poll tick and the confirmation window
      // off S.rate and this line's own estimated duration instead of fixed
      // numbers.
      if(!started) return;
      if(!speechSynthesis.speaking){
        missCount++;
        if(missCount>=missesNeeded) finishOrRetry();
      } else {
        missCount = 0;
      }
    }, pollMs);
    // Hard ceiling as a last resort, scoped to just this one utterance.
    let ceilingExtensions = 0;
    const scheduleCeiling = (ms)=>{
      hardCeiling = setTimeout(()=>{
        if(done) return;
        if(!started && ceilingExtensions < 2){
          // Engine hasn't fired onstart yet -- most likely a slow-spinning-up
          // network voice, not a genuinely stuck one. Give it a couple of
          // short grace extensions instead of killing the line before it
          // ever made a sound. Capped at 2 (2.5s each).
          ceilingExtensions++;
          scheduleCeiling(2500);
          return;
        }
        console.warn('[speech] watchdog: utterance never finished, cancelling', {token, started});
        speechSynthesis.cancel();
        finish();
      }, ms);
    };
    scheduleCeiling(Math.min(15000, estimateMs(text)*3 + 4000));
    } // end startUtterance
  });
}

/* ---- player ---- */
function updateProgress(){
  const total = S.lines.length;
  const cur = S.idx+1;
  document.getElementById('progressFill').style.width = Math.round((cur/total)*100)+'%';
  document.getElementById('capLeft').textContent = 'Line '+cur+' of '+total;
  document.getElementById('capRight').textContent = TITLES[S.chapter] || '';
}

async function runLine(i){
  if(i<0) i=0;
  if(i>=S.lines.length){
    const nextIdx = CH_KEYS.indexOf(S.chapter)+1;
    if(nextIdx < CH_KEYS.length){
      S.chapter = CH_KEYS[nextIdx];
      S.lines = CHAPTERS[S.chapter];
      i = 0;
    } else {
      S.playing = false;
      document.getElementById('playPauseBtn').textContent = '▶';
      document.getElementById('lineText').textContent = 'The end.';
      return;
    }
  }
  S.idx = i;
  const myToken = ++S.token;
  document.getElementById('chapterTag').textContent = TITLES[S.chapter] || '';
  document.getElementById('lineText').textContent = S.lines[i];
  updateProgress();
  await speak(S.lines[i], myToken);
  if(myToken!==S.token) return;
  if(S.playing) runLine(S.idx+1);
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  S.lines = CHAPTERS[S.chapter];
  S.idx = 0;
  S.playing = true;
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('player').classList.remove('hidden');
  document.getElementById('playPauseBtn').textContent = '⏸';
  runLine(0);
});

document.getElementById('playPauseBtn').addEventListener('click', ()=>{
  S.playing = !S.playing;
  document.getElementById('playPauseBtn').textContent = S.playing ? '⏸' : '▶';
  if(S.playing){ runLine(S.idx); }
  else { stopAllAudio(); S.token++; }
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  stopAllAudio(); S.token++;
  runLine(Math.max(0, S.idx-1));
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  stopAllAudio(); S.token++;
  runLine(S.idx+1);
});
document.getElementById('backBtn').addEventListener('click', ()=>{
  stopAllAudio(); S.token++; S.playing=false;
  document.getElementById('player').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
});
</script>
